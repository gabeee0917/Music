    const ws = words(text).join(' ');
    if (/\btri ?tone\b|\btritone\b|\bsix semitones\b/.test(ws)) return 'TT';
    if (/\baugmented (4|fourth|four)\b|\bdiminished (5|fifth|five)\b/.test(ws)) return 'TT';
    const q = (ws.match(/\b(perfect|major|minor)\b/) || [])[1];
    const nWord = (ws.match(/\b(second|third|fourth|fifth|sixth|seventh|two|three|four|five|six|seven|2nd|3rd|4th|5th|6th|7th|[2-7])\b/) || [])[1];
    if (!nWord) return null;
    const n = NUM[nWord] || parseInt(nWord, 10);
    if (!n) return null;
    if (n === 4 || n === 5) return 'P' + n;
    if (q === 'major') return 'M' + n;
    if (q === 'minor') return 'm' + n;
    return null;
  }

  /* Hold to talk. `start` begins listening and reports what it hears as it
     goes; `stop` (on release) ends it, and `onDone` gets the best transcript. */
  function listen({ lang, onHear, onDone, onError }) {
    if (!Rec) { if (onError) onError('unsupported'); return null; }

    r.lang = lang || 'en-NZ';

    r.continuous = true;

      abort: () => { ended = true; try { r.abort(); } catch (e) { /* ignore */ } },

    parseNotes, parseDegrees, parseChords, parseInterval, quality, token,
    get speaking() { return speaking; },
  };
})();

    clock: [[0, 'Off'], [3, '3s'], [5, '5s'], [7, '7s'], [10, '10s'], [15, '15s'], [20, '20s']],
    help: [[true, 'On'], [false, 'Off']],
    range: [[0, 'Narrow'], [1, 'Normal'], [2, 'Full'], [3, 'Widest']],
  };
  const customDefaults = () => ({ keyCap: 4, opts: 4, clock: 0, help: false, range: 1 });

  const blankStat = () => ({ n: 0, c: 0, t: 0, tn: 0 });
  const blankSession = () => ({ n: 0, c: 0, t: 0, tn: 0, streak: 0, best: 0 });
  const defaults = () => ({
    mode: 'both', auto: true, focus: 'all', level: 'medium', custom: customDefaults(),
    checker: 'all',
    // Option questions: tap an option, or type the answer. Both always work.
    answerStyle: 'options',
    // Who reads the questions: Gemini's designed voice (a young Kiwi woman),
    // or the device's own English voice. Gemini falls back to the device.
    voiceEngine: 'gemini',
    // Hold-to-talk is on by default wherever it can work: outside the Claude
    // app, which blocks the microphone, and in a browser that can listen.
    holdMic: typeof window !== 'undefined' && !window.claude && Voice.canListen,
    types: Object.fromEntries(TYPE_IDS.map(id => [id, id === 'triad'])),
    drills: Object.fromEntries(DRILL_IDS.map(id => [id, Q.DRILL[id].def !== false])),
  });

  const S = {
    settings: defaults(),
    touched: false,
    stale: false,
    bags: {},
    q: null,
    entry: { tokens: [], pending: null },
    answered: false,
    t0: 0,
    advTimer: null,
    upcoming: null, ahead: { made: 0, used: 0 },
    view: 'quiz',
    explore: { mode: 'major', slot: 0, neck: 'all' },
    session: blankSession(),
    stats: { keys: {}, drills: {} },
    store: { status: 'connecting', ref: null, saving: false, dirty: false, timer: null },
    // The AI checker: the sample function once the viewer hands it over, and
    // whatever is in flight for the current answer.
    ck: { fn: null, status: 'loading', grade: null, review: null },
    recent: [],
  };

  /* ---------- Bags: even coverage ---------- */
  function allKeyIds() {
    const modes = S.settings.mode === 'both' ? ['major', 'minor'] : [S.settings.mode];
    return modes.flatMap(m => Array.from({ length: 12 }, (_, i) => m + ':' + i));
  }
  // Weak focus narrows the pass to keys under 90%, untried keys included. It
  // only engages with enough of them left to still be a pass worth running.
  function weakKeyIds(all) {
    const weak = all.filter(id => {
      const st = S.stats.keys[id];
      return !st || st.n < 3 || st.c / st.n < 0.9;
    });
    return weak.length >= 4 ? weak : all;
  }
  /* The keys guitar music is actually written in, because that is where the
     open strings and the easy shapes are: C G D A E and F, plus the relative
     minors of each. Twelve of the twenty-four. This is a narrowing, not a
     simplification — the theory is identical, there is just less of it to
     carry while the shapes are still going in. */
  const GUITAR_SLOTS = { major: [0, 1, 2, 3, 4, 11], minor: [0, 1, 2, 3, 9, 11] };
  function guitarKeyIds(all) {
    const want = new Set(Object.entries(GUITAR_SLOTS)
      .flatMap(([m, slots]) => slots.map(i => m + ':' + i)));
    const hit = all.filter(id => want.has(id));
    return hit.length ? hit : all;
  }
  function profile() {
    if (S.settings.level === 'custom') {
      const c = S.settings.custom;
      return Object.assign({}, c, { types: 'mine', extra: c.clock ? Math.max(1, Math.round(c.clock / 5)) : 0 });
    }
    return PROFILES[S.settings.level] || PROFILES.medium;
  }
  const levelInfo = () => LEVELS.find(l => l.id === S.settings.level) || LEVELS[1];
  /* The level caps how many sharps or flats a key may carry, and the focus
     setting narrows within that. Easy with Guitar keys is C G D F and their
     minors; the two never fight, because an empty overlap falls back to the
     level's own keys rather than to nothing. */
  function buildKeyBag() {
    const all = allKeyIds();
    const cap = profile().keyCap;
    const inLevel = all.filter(id => {
      const [m, sl] = id.split(':');
      return T.keySig(T.makeKey(m, +sl)).count <= cap;
    });
    const base = inLevel.length ? inLevel : all;
    const f = S.settings.focus;
    S.bags.key = new Q.Bag(f === 'weak' ? weakKeyIds(base)
      : f === 'guitar' ? guitarKeyIds(base) : base);
  }
  /* Chord shapes by level. Easy holds to triads whatever is switched on;
     medium is exactly what you picked; hard adds 7ths; god mode uses every
     shape there is. */
  function effectiveTypes() {
    const on = TYPE_IDS.filter(id => S.settings.types[id]);
    const t = profile().types;
    if (t === 'triad') return ['triad'];
    if (t === 'plus7') return [...new Set(on.concat(['triad', '7th']))];
    if (t === 'all') return TYPE_IDS.slice();
    return on.length ? on : ['triad'];
  }
  // A drill that needs minor keys sits out while the key pool is major only.
  function usableDrills() {
    return DRILL_IDS.filter(id => {
      if (!S.settings.drills[id]) return false;
      const need = Q.DRILL[id].needs;
      if (need === 'minor' || need === 'major') return S.settings.mode === 'both' || S.settings.mode === need;
      return true;
    });
  }
  function buildDrillBag() {
    const ids = usableDrills();
    S.bags.drill = new Q.Bag(ids.length ? ids : ['deg2note']);
  }
  function buildTypeBag() {
    S.bags.type = new Q.Bag(effectiveTypes());
  }
  function buildAllBags() {
    buildKeyBag();
    buildDrillBag();
    buildTypeBag();
    S.bags.deg = new Q.Bag([0, 1, 2, 3, 4, 5, 6]);
    S.bags.degNT = new Q.Bag([1, 2, 3, 4, 5, 6]);
    S.bags.root = new Q.Bag(Array.from({ length: 12 }, (_, i) => i));
  }
  // Draw a degree the chord shape actually fits on, still cycling the bag so
  // degrees stay even over time.
  function drawDeg(bag, ok, pool) {
    const allowed = ok ? pool.filter(d => ok.includes(d)) : pool;
    if (!allowed.length) return ok[Math.floor(Math.random() * ok.length)];
    for (let i = 0; i < 24; i++) {
      const d = bag.next();
      if (allowed.includes(d)) return d;
    }
    return allowed[Math.floor(Math.random() * allowed.length)];
  }
  const ctx = () => ({
    level: profile().range,
    opts: profile().opts,
    // allow: a drill that only makes sense for some shapes keeps drawing until
    // the bag offers one, handing the others back so the pass stays even.
    nextType: allow => {
      for (let i = 0; i < 14; i++) {
        const id = S.bags.type.next();
        const t = id === 'sus' ? (Math.random() < 0.5 ? 'sus2' : 'sus4') : id;
        if (!allow || allow.includes(t)) return t;
        S.bags.type.putBack(id);
      }
      const on = effectiveTypes();
      return allow.find(a => on.includes(a)) || allow[0];
    },
    nextKey: mode => {
      for (let i = 0; i < 26; i++) {
        const id = S.bags.key.next();
        const [m, s] = id.split(':');
        if (!mode || m === mode) return T.makeKey(m, +s);
        S.bags.key.putBack(id);
      }
      return T.makeKey(mode || 'major', Math.floor(Math.random() * 12));
    },
    nextDeg: ok => drawDeg(S.bags.deg, ok, [0, 1, 2, 3, 4, 5, 6]),
    nextDegNT: ok => drawDeg(S.bags.degNT, ok, [1, 2, 3, 4, 5, 6]),
    nextRoot: () => S.bags.root.next(),
  });

  /* ---------- Question flow ---------- */
  // A question thrown away unanswered (settings changed mid-question) hands its
  // key and drill back to the current pass, so no key gets skipped.
  function releaseUnanswered() {
    const q = S.q;
    if (!q || S.answered) return;
    if (q.statKey && q.bags.key === S.bags.key) S.bags.key.putBack(q.statKey);
    if (q.bags.drill === S.bags.drill) S.bags.drill.putBack(q.drill);
  }

  function nextQuestion() {
    clearTimeout(S.advTimer);
    stopChecker();
    stopSpeech();
    if (S.listening) { S.listening.abort(); S.listening = null; }
    releaseUnanswered();
    const bags = { drill: S.bags.drill, key: S.bags.key };
    const q = takeUpcoming() || Q.make(bags.drill.next(), ctx());
    q.bags = bags;
    S.q = q;
    S.entry = { tokens: [], pending: null };
    S.answered = false;
    resetNotes();
    renderQuestion();
    renderPass();
    S.t0 = performance.now();
    startClock();
    planAhead();
  }

  /* The clock, for hard and god mode only. It starts when the question is
     drawn and gets longer for answers that take several taps, so spelling a
     four-note chord is not held to the same few seconds as picking one note.
     Running out counts as a miss, whatever was half-entered. It never runs
     behind the start screen or another tab: coming back restarts it, rather
     than greeting you with a question that expired while you were away. */
  function clockFor(q) {
    const p = profile();
    if (!p.clock || !q) return 0;
    return 1000 * (p.clock + p.extra * Math.max(0, (q.slots || 1) - 1) + (q.input === 'choice' && S.settings.answerStyle === 'typing' ? 5 : 0));
  }
  function stopClock() {
    cancelAnimationFrame(S.clockRaf);
    S.clockRaf = 0;
    const c = $('#qClock');
    if (c) { c.hidden = true; c.classList.remove('low'); }
  }
  function startClock() {
    stopClock();
    const ms = clockFor(S.q);
    if (!ms || S.answered || S.atStart || S.view !== 'quiz') return;
    const end = performance.now() + ms;
    const c = $('#qClock'), fill = $('#qClockFill');
    c.hidden = false;
    const tick = () => {
      if (S.answered || S.atStart || S.view !== 'quiz') { stopClock(); return; }
      const left = Math.max(0, end - performance.now());
      fill.style.transform = 'scaleX(' + (left / ms).toFixed(4) + ')';
      c.classList.toggle('low', left < ms * 0.3);
      if (left <= 0) { stopClock(); S.timedOut = true; submit(S.entry ? S.entry.tokens.slice() : []); return; }
      S.clockRaf = requestAnimationFrame(tick);
    };
    S.clockRaf = requestAnimationFrame(tick);
  }

  /* ---------- Start screen ---------- */
  function renderStart() {
    const box = $('#levels');
    box.innerHTML = '';
    const on = usableDrills().length;
    $('#startSub').textContent = `${on} drill${on === 1 ? '' : 's'} switched on.`;
    LEVELS.forEach(l => {
      const custom = l.id === 'custom';
      // Custom opens its dials instead of starting straight away.
      const b = button('level-btn lv-' + l.id + (l.id === S.settings.level ? ' on' : ''), null,
        custom ? () => { S.customOpen = !S.customOpen; renderStart(); } : () => startAt(l.id));
      b.dataset.level = l.id;
      b.append(el('span', 'lv-name', l.name),
        el('span', 'lv-sub' + (custom ? ' lv-sub-custom' : ''), custom ? customSummary() : l.sub));
      if (custom) b.setAttribute('aria-expanded', String(!!S.customOpen));
      box.append(b);
      if (custom && S.customOpen) box.append(customEditor(() => startAt('custom')));
    });
    refreshCustom();
  }

  /* ---------- Custom difficulty ---------- */
  function customSummary() {
    const c = S.settings.custom;
    const shapes = Q.TYPE_SETTINGS.filter(t => S.settings.types[t.id]).map(t => t.name.toLowerCase());
    const range = CUSTOM_CHOICES.range.find(([v]) => v === c.range)[1].toLowerCase();
    return [
      c.keyCap === 7 ? 'All 24 keys' : c.keyCap === 0 ? 'C major and A minor only'
        : `Keys up to ${c.keyCap} sharp${c.keyCap === 1 ? '' : 's'} or flat${c.keyCap === 1 ? '' : 's'}`,
      shapes.length ? shapes.join(', ') : 'triads',
      `${c.opts} options`,
      c.clock ? `${c.clock}s clock` : 'no clock',
      c.help ? 'key notes shown' : null,
      `${range} drill range`,
    ].filter(Boolean).join(' · ') + '.';
  }
  function customEditor(onStart) {
    const box = el('div', 'custom-ed');
    const row = (label, key) => {
      box.append(el('p', 'ce-label', label));
      const seg = el('div', 'seg wide ce-seg');
      seg.setAttribute('role', 'group');
      seg.setAttribute('aria-label', label);
      CUSTOM_CHOICES[key].forEach(([val, txt]) => {
        const b = button(null, txt, () => { S.settings.custom[key] = val; customChanged(); });
        b.dataset.ckey = key;
        b.dataset.cval = String(val);
        seg.append(b);
      });
      box.append(seg);
    };
    row('Keys — most sharps or flats', 'keyCap');
    box.append(el('p', 'ce-label', 'Chord shapes'));
    const chips = el('div', 'ce-chips');
    Q.TYPE_SETTINGS.forEach(t => {
      const b = button('ce-chip', t.name, () => {
        const on = !S.settings.types[t.id];
        // At least one shape stays on, or chord drills would have nothing to ask.
        if (!on && TYPE_IDS.filter(x => S.settings.types[x]).length === 1) return;
        S.settings.types[t.id] = on;
        customChanged();
      });
      b.dataset.ctype = t.id;
      chips.append(b);
    });
    box.append(chips);
    row('Options per question', 'opts');
    row('Timer per question', 'clock');
    row("Key's notes on screen", 'help');
    row('Drill range', 'range');
    box.append(el('p', 'group-note', 'Drill range is how far each drill reaches. Narrow keeps frets '
      + 'low, CAGED to the E and A shapes, modes to the common four and rhythm to plain notes in '
      + '4/4, 3/4 and 2/4. Widest opens every drill all the way up. Chord shapes here are the '
      + 'same switches as in Settings.'));
    if (onStart) box.append(button('btn primary block ce-start', 'Start custom', onStart));
    return box;
  }
  function customChanged() {
    buildKeyBag();
    buildTypeBag();
    S.stale = true;
    touched();
    refreshCustom();
  }
  function refreshCustom() {
    document.querySelectorAll('[data-ckey]').forEach(b => b.setAttribute('aria-pressed',
      String(String(S.settings.custom[b.dataset.ckey]) === b.dataset.cval)));
    document.querySelectorAll('[data-ctype]').forEach(b => b.setAttribute('aria-pressed',
      String(!!S.settings.types[b.dataset.ctype])));
    document.querySelectorAll('.lv-sub-custom').forEach(e => { e.textContent = customSummary(); });
    document.querySelectorAll('#view-settings .switch').forEach(sw => sw.setAttribute('aria-checked', String(!!sw._get())));
    const cs = $('#customSettings');
    if (cs) cs.hidden = S.settings.level !== 'custom';
  }
  function renderLevelChip() {
    const l = levelInfo();
    const c = $('#levelChip');
    c.textContent = l.name;
    c.className = 'level-chip lv-' + l.id;
  }
  function showStart() {
    S.atStart = true;
    stopClock();
    $('#startPanel').hidden = false;
    $('#quizBody').hidden = true;
    renderStart();
  }
  function hideStart() {
    S.atStart = false;
    $('#startPanel').hidden = true;
    $('#quizBody').hidden = false;
    renderLevelChip();
  }
  function startAt(id) {
    if (S.settings.level !== id) {
      S.settings.level = id;
      buildKeyBag();
      buildTypeBag();
      touched();
      refreshSettings();
    }
    hideStart();
    if (S.settings.voice) unlockAudio();
    nextQuestion();
  }

  /* The bar counts keys, which only means something if the drills on are
     drills that have a key. A set made only of neck drills — CAGED, capo,
     octaves — draws no keys at all, so the counter would sit at "0 of 24"
     for the whole session and read as broken rather than as not applicable. */
  const usesKeys = () => DRILL_IDS.some(id => S.settings.drills[id] && !Q.DRILL[id].keyless);
  function renderPass() {
    const bag = S.bags.key, size = bag.size, drawn = bag.pass ? bag.drawn : 0;
    const ticks = $('#ticks');
    const keyed = usesKeys();
    ticks.hidden = !keyed;
    if (keyed) {
      if (ticks.children.length !== size) {
        ticks.innerHTML = '';
        for (let i = 0; i < size; i++) ticks.append(el('span'));
      }
      [...ticks.children].forEach((t, i) => t.classList.toggle('on', i < drawn));
    }
    $('#passText').textContent = keyed
      ? `Pass ${Math.max(bag.pass, 1)}: ${drawn} of ${size} keys`
      : `${S.session.n} answered`;
    $('#streakText').textContent = `Streak ${S.session.streak}`;
  }

  function renderQuestion() {
    const q = S.q;
    $('#qDrill').textContent = Q.DRILL[q.drill].name;
    const k = $('#qKey');
    k.textContent = q.context;
    k.hidden = !q.context;
    renderHero(q);
    $('#qSub').textContent = q.sub;
    /* Easy shows the key's notes while you answer — you still have to count
       along them. Only for a key the question GIVES you: a drill asking
       which key something is in would have its answer printed under it. */
    const help = $('#qHelp');
    const given = q.key && q.context && q.context.includes(T.keyName(q.key));
    help.hidden = !(profile().help && given);
    if (!help.hidden) help.textContent = T.scale(q.key).map(T.name).join('  ');
    const fb = $('#feedback');
    fb.hidden = true;
    fb.innerHTML = '';
    $('#inputArea').hidden = false;
    renderPad();
    renderSlots();
    renderActions();
    S.heard = '';
    renderVoiceBar();
    sayQuestion();
  }

  function renderHero(q) {
    const h = $('#qHero');
    h.innerHTML = '';
    h.removeAttribute('aria-label');
    const capEl = $('#qCap');
    capEl.textContent = q.heroCap || '';
    capEl.hidden = !q.heroCap;
    if (q.heroKind === 'fret') {
      h.className = 'q-hero hero-fret';
      h.append(fretboard(q.hero));
    } else if (q.heroKind === 'seq' || q.heroKind === 'set') {
      h.className = 'q-hero hero-seq';
      q.hero.forEach(x => {
        if (typeof x === 'string') { h.append(el('span', null, x)); return; }
        const s = el('span', 'capped');
        s.append(el('b', null, x.t), el('i', null, x.c));
        h.append(s);
      });
    } else if (q.heroKind === 'pair') {
      h.className = 'q-hero hero-pair';
      h.append(el('span', null, q.hero[0]), el('span', 'arrow', '→'), el('span', null, q.hero[2]));
      h.setAttribute('aria-label', `${spoken(q.hero[0])} up to ${spoken(q.hero[2])}`);
    } else if (q.heroKind === 'words') {
      h.className = 'q-hero hero-words';
      h.textContent = q.hero;
    } else {
      const n = [...q.hero].length;
      h.className = 'q-hero ' + (n <= 2 ? 'hero-xl' : n <= 4 ? 'hero-l' : 'hero-m');
      h.textContent = q.hero;
    }
  }

  // How far the answer given sits from the right one, in the shorter direction.
  function pitchGap(mine, right, isChord) {
    const toPc = t => {
      const ch = isChord ? T.chordFromName(t) : null;
      const n = ch ? ch.root : (T.isNoteName(t) ? T.parse(t) : null);
      return n ? T.pc(n) : null;
    };
    const a = toPc(mine), b2 = toPc(right);
    if (a == null || b2 == null) return null;
    let d = T.mod(b2 - a, 12);
    if (d === 0) return null;
    if (d > 6) d -= 12;
    const n = Math.abs(d);
    const size = n === 1 ? 'a half step' : n === 2 ? 'a whole step' : n + ' semitones';
    return `${mine} sits ${size} ${d > 0 ? 'below' : 'above'} ${right}.`;
  }

  /* ---------- Fretboard diagram ---------- */
  /* Takes either a single {str, fret} or {dots: [...], line, cap}: a neck
     question is much easier to read as a neck than as a sentence, and several
     of the guitar drills want to show two spots at once (where you are, and
     where the answer turned out to be) or a bare string with no dot on it at
     all — "which fret" is a question about an empty string.

     The window slides to hold every dot rather than sitting at a fixed five
     frets, because a shape that runs off the edge of the diagram is worse
     than no diagram. */
  function fretboard(spec) {
    const dots = (spec.dots || [spec]).filter(d => d && d.str);
    const fretted = dots.map(d => d.fret).filter(f => f > 0);
    const lo = fretted.length ? Math.min(...fretted) : 1;
    const hi = fretted.length ? Math.max(...fretted) : 1;
    // An explicit window is for the whole-neck map; otherwise it slides to hold
    // whatever dots it was given.
    const span = spec.span || Math.max(5, Math.min(7, hi - lo + 2));
    let start = spec.from !== undefined ? spec.from
      : Math.max(0, Math.min(lo - 2, 12 - span));
    if (spec.from === undefined && hi > start + span) {
      start = Math.max(0, Math.min(hi - span, 12 - span));
    }
    const frets = Array.from({ length: span }, (_, i) => start + i + 1);
    const at = (st, f) => dots.find(d => d.str === st && d.fret === f);
    const line = spec.line || (dots.length === 1 ? dots[0].str : null);

    const wrap = el('div', 'fb');
    wrap.setAttribute('role', 'img');
    wrap.setAttribute('aria-label', spec.alt || dots.map(d =>
      `string ${d.str}, ${d.fret ? 'fret ' + d.fret : 'open'}`).join('; ') || 'fretboard');
    const grid = el('div', 'fb-grid' + (start === 0 ? ' nut' : ''));
    grid.style.gridTemplateColumns = `2.1em repeat(${span}, 1fr)`;
    for (let st = 1; st <= 6; st++) {
      const o = at(st, 0);
      const open = el('div', 'fb-open' + (o ? ' on' : '') + (line === st ? ' lit' : ''));
      open.append(el('span', 'fb-name', T.OPEN_NAME[st]));
      /* An open string in the key is as much a note as a fretted one. Leaving
         its degree off made six of them read as decoration on the neck map. */
      if (o && o.text) open.append(el('span', 'fb-odeg' + (o.kind ? ' ' + o.kind : ''), o.text));
      grid.append(open);
      frets.forEach(f => {
        const c = el('div', 'fb-cell' + (st === 1 ? ' fb-first' : '') + (st === 6 ? ' fb-last' : '')
          + (line === st ? ' lit' : ''));
        const d = at(st, f);
        if (d) c.append(el('span', 'fb-dot' + (d.kind ? ' ' + d.kind : ''), d.text || ''));
        grid.append(c);
      });
    }
    grid.append(el('div', 'fb-num', '0'));
    frets.forEach(f => grid.append(el('div', 'fb-num' + ([3, 5, 7, 9, 12].includes(f) ? ' mark' : ''), String(f))));
    wrap.append(grid);
    const cap = spec.cap !== undefined ? spec.cap
      : (dots.length === 1 ? `String ${dots[0].str}${dots[0].fret ? ', fret ' + dots[0].fret : ', open'}` : '');
    if (cap) wrap.append(el('p', 'fb-cap', cap));
    return wrap;
  }

  function renderPad() {
    const q = S.q, pad = $('#pad');
    pad.innerHTML = '';
    if (['note', 'notes', 'chord', 'chords'].includes(q.input)) {
      const g = el('div', 'notes-grid');
      for (const a of [1, 0, -1]) {
        for (let l = 0; l < 7; l++) {
          const n = T.name({ l, a });
          const b = button('key' + (a ? ' alt' : ''), n);
          b.dataset.note = n;
          b.setAttribute('aria-label', spoken(n));
          g.append(b);
        }
      }
      pad.append(g);
      if (q.input === 'chord' || q.input === 'chords') {
        const quals = QUALS[q.type];
        const r = el('div', 'quality-row');
        r.style.gridTemplateColumns = `repeat(${quals.length}, 1fr)`;
        quals.forEach(([label, suf]) => {
          const b = button('qual', label);
          b.dataset.suffix = suf;
          b.setAttribute('aria-label', QUAL_SPOKEN[suf]);
          r.append(b);
        });
        pad.append(r);
      }
    } else if (q.input === 'degree') {
      const r = el('div', 'deg-row');
      T.MODES[q.degreeMode].labels.forEach(lb => {
        const b = button('deg-key', lb);
        b.dataset.deg = lb;
        b.setAttribute('aria-label', 'degree ' + spoken(lb));
        r.append(b);
      });
      pad.append(r);
    } else if (q.input === 'choice' && S.settings.answerStyle !== 'typing') {
      const g = el('div', 'choice-grid');
      g.style.gridTemplateColumns = `repeat(${Math.min(q.choiceCols || q.choices.length, 7)}, 1fr)`;
      q.choices.forEach(c => {
        const b = button('ch-key', c);
        b.dataset.choice = c;
        g.append(b);
      });
      pad.append(g);
      pad.append(answerSwitch('Type it instead', 'typing'));
    } else if (q.input === 'choice') {
      /* The same question, written: a box and a Check button, and Enter does
         the same as Check. */
      const row = el('div', 'type-row');
      row.id = 'typeRow';
      const inp = el('input', 'type-in');
      inp.id = 'ansText';
      inp.type = 'text';
      inp.autocomplete = 'off';
      inp.spellcheck = false;
      inp.setAttribute('autocapitalize', 'off');
      inp.setAttribute('autocorrect', 'off');
      inp.setAttribute('enterkeyhint', 'done');
      inp.setAttribute('aria-label', 'Your answer');
      inp.placeholder = 'Type your answer';
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); submitTyped(); }
      });
      const go = button('btn primary type-go', 'Check', submitTyped);
      go.id = 'typeGo';
      row.append(inp, go);
      pad.append(row);
      pad.append(el('p', 'type-hint', checkerOn()
        ? 'Write it however you would say it — # and b are fine. Anything that isn\'t an exact match goes to the checker.'
        : 'Write it however you would say it — # and b are fine.'));
      pad.append(answerSwitch('Pick from options', 'options'));
      // Straight into the box on a keyboard; a phone waits for the tap.
      if (!matchMedia('(pointer: coarse)').matches) setTimeout(() => { if (S.q === q && !S.answered) inp.focus(); }, 0);
    } else if (q.input === 'interval') {
      const g = el('div', 'iv-grid');
      T.INTERVAL_PAD.forEach(id => {
        const b = button('iv-key', id);
        b.dataset.iv = id;
        b.setAttribute('aria-label', IV_SPOKEN[id]);
        g.append(b);
      });
      pad.append(g);
    }
  }

  // Swap how option questions are answered, right on the question. It sticks.
  function answerSwitch(label, to) {
    const b = button('ans-switch', label, () => {
      if (S.answered) return;
      S.settings.answerStyle = to;
      touched();
      renderPad();
      refreshSettings();
      if (to === 'typing') { const inp = $('#ansText'); if (inp) inp.focus(); }
    });
    b.id = 'ansSwitch';
    return b;
  }

  function renderSlots() {
    const q = S.q, E = S.entry, box = $('#slots');
    const show = q.input === 'notes' || q.input === 'chords' || q.input === 'chord';
    box.hidden = !show;
    document.querySelectorAll('#pad .key.on').forEach(b => b.classList.remove('on'));
    if (!show) return;
    box.innerHTML = '';
    box.className = 'slots' + (q.slots >= 5 ? ' many' : '');
    // No labels over the boxes: a degree number there answers half the question.
    for (let i = 0; i < q.slots; i++) {
      const active = i === E.tokens.length;
      const pending = active && !!E.pending;
      const s = el('div', 'slot' + (active ? ' active' : '') + (pending ? ' pending' : ''));
      const txt = E.tokens[i] || (pending ? E.pending : '');
      const boxEl = el('div', 'slot-box', txt);
      if ([...txt].length > 4) boxEl.style.fontSize = '15px';
      s.append(boxEl);
      box.append(s);
    }
    if (E.pending) {
      const b = [...document.querySelectorAll('#pad .key')].find(x => x.dataset.note === E.pending);
      if (b) b.classList.add('on');
    }
  }

  function renderActions() {
    const q = S.q, box = $('#actions');
    box.innerHTML = '';
    const multi = q.input === 'notes' || q.input === 'chords';
    box.append(button('btn text', 'Show answer', () => submit(null, true)), el('span', 'spacer'));
    if (multi || q.input === 'chord') {
      const u = button('btn text', 'Undo', undo);
      u.id = 'undoBtn';
      box.append(u);
    }
    if (multi) {
      const c = button('btn primary', 'Check', () => submit(S.entry.tokens.slice()));
      c.id = 'checkBtn';
      box.append(c);
    }
    updateActions();
  }
  function updateActions() {
    const E = S.entry, u = $('#undoBtn'), c = $('#checkBtn');
    if (u) u.disabled = !E.tokens.length && !E.pending;
    if (c) c.disabled = E.tokens.length < S.q.slots;
  }

  function nudge() {
    const s = $('#slots');
    s.classList.remove('nudge');
    void s.offsetWidth;
    s.classList.add('nudge');
  }

  function onPad(e) {
    const b = e.target.closest('button');
    if (!b || S.answered) return;
    const q = S.q, E = S.entry;
    if (b.dataset.note) {
      const n = b.dataset.note;
      if (q.input === 'note') return submit([n]);
      if (E.tokens.length >= q.slots) return nudge();
      if (q.input === 'notes') E.tokens.push(n);
      else E.pending = n;
    } else if (b.dataset.suffix !== undefined) {
      if (!E.pending) return nudge();
      E.tokens.push(E.pending + b.dataset.suffix);
      E.pending = null;
      if (q.input === 'chord') return submit(E.tokens.slice());
    } else if (b.dataset.deg) {
      return submit([b.dataset.deg]);
    } else if (b.dataset.iv) {
      return submit([b.dataset.iv]);
    } else if (b.dataset.choice !== undefined) {
      return submit([b.dataset.choice]);
    }
    renderSlots();
    updateActions();
  }

  function undo() {
    if (S.answered) return;
    const E = S.entry;
    if (E.pending) E.pending = null;
    else E.tokens.pop();
    renderSlots();
    updateActions();
  }

  function submit(tokens, revealed = false, typed = null, decided = false) {
    if (S.answered) return;
    S.answered = true;
    stopClock();
    const timedOut = !!S.timedOut;
    S.timedOut = false;
    const q = S.q, dt = performance.now() - S.t0;
    // A clock running out on a typed question takes whatever was in the box.
    if (timedOut && q.input === 'choice' && typed === null) {
      const inp = $('#ansText');
      if (inp && inp.value.trim()) typed = inp.value.trim();
    }
    const notes = sealNotes();
    const base = { revealed, tokens, dt, timedOut, typed, notes };
    /* A typed answer that is not an exact match is not wrong yet: it may be
       the right thing in other words. The checker decides, quickly, and the
       verdict waits for it. Without the checker it is judged as written. */
    if (typed !== null && !decided && !revealed && !timedOut && !Q.check(q, tokens) && checkerOn()) {
      renderFeedback(Object.assign({ ok: false, pending: true }, base));
      gradeTyped(q, base);
      return;
    }
    const ok = !revealed && !timedOut && Q.check(q, tokens);
    const enh = !ok && !revealed && !timedOut && typed === null && Q.enharmonic(q, tokens);
    finishAnswer(q, Object.assign({ ok, enh }, base));
  }
  function finishAnswer(q, r) {
    if (S.q !== q) return;
    record(r.ok, r.dt, r.revealed);
    renderFeedback(r);
    renderPass();
    renderVoiceBar();
    sayVerdict(q, r);
    remember(q, r);
    const reviewing = startReview(q, r);
    // Moving on by itself would throw the review away, so it waits while the
    // checker has something to say.
    if (r.ok && S.settings.auto && !reviewing) {
      S.advTimer = setTimeout(() => {
        if (S.view === 'quiz' && S.answered && S.q === q) nextQuestion();
      }, 1200);
    }
  }
  function submitTyped() {
    if (S.answered || !S.q || S.q.input !== 'choice') return;
    const inp = $('#ansText');
    const raw = inp ? inp.value.trim() : '';
    if (!raw) {
      const row = $('#typeRow');
      if (row) { row.classList.remove('nudge'); void row.offsetWidth; row.classList.add('nudge'); }
      if (inp) inp.focus();
      return;
    }
    submitText(raw);
  }
  /* Words for an option question, typed or spoken. A match for the answer
     is right. A match for one of the other options is plainly that option,
     so it is wrong without asking anyone. Anything else may still be the
     right idea in other words, and goes to the checker. */
  function submitText(raw) {
    const q = S.q;
    if (S.answered || !q || q.input !== 'choice') return;
    const hit = typedMatch(q, raw);
    if (hit !== null) return submit([hit], false, raw, true);
    const other = (q.choices || []).find(c => typedMatch({ answer: [c], answerSuffix: q.answerSuffix }, raw) !== null);
    if (other !== undefined) return submit([other], false, raw, true);
    submit([raw], false, raw);
  }

  function record(ok, dt, revealed) {
    const ss = S.session, timed = !revealed;
    ss.n++;
    if (ok) {
      ss.c++;
      ss.streak++;
      ss.best = Math.max(ss.best, ss.streak);
    } else ss.streak = 0;
    if (timed) { ss.t += dt; ss.tn++; }
    const bump = (obj, id) => {
      const s = obj[id] || (obj[id] = blankStat());
      s.n++;
      if (ok) s.c++;
      if (timed) { s.t += Math.round(dt); s.tn++; }
    };
    bump(S.stats.drills, S.q.drill);
    if (S.q.statKey) bump(S.stats.keys, S.q.statKey);
    scheduleSave();
  }

  function chipRow(label, chips) {
    const row = el('div', 'fb-row');
    const c = el('div', 'chips');
    chips.forEach(ch => {
      const cls = 'chip' + (ch.cls ? ' ' + ch.cls : '') + (ch.play ? ' playable' : '');
      c.append(ch.play ? button(cls, ch.text, ch.play) : el('span', cls, ch.text));
    });
    row.append(el('span', 'fb-row-label', label), c);
    return row;
  }

  function renderFeedback(r) {
    const q = S.q, fb = $('#feedback');
    fb.innerHTML = '';
    $('#inputArea').hidden = true;
    fb.hidden = false;
    const plural = q.answer.length > 1;
    const [text, tone] = r.pending ? ['Checking…', 'muted']
      : r.ok ? ['Correct', 'ok']
      : r.timedOut ? ['Out of time', 'bad']
      : r.revealed ? ['Skipped', 'muted']
      : r.enh ? [plural ? 'Right pitches, wrong spelling' : 'Right pitch, wrong spelling', 'warn']
      : ['Not quite', 'bad'];
    const head = el('div', 'fb-head');
    head.append(el('p', 'fb-verdict ' + tone, text));
    if (!r.revealed) head.append(el('span', 'fb-time', secs(r.dt)));
    fb.append(head);

    const suffix = q.answerSuffix || '';
    const isChord = q.input === 'chord' || q.input === 'chords';
    const rows = el('div', 'fb-rows');
    /* When a question accepts several answers, show the one that was given
       rather than the one the generator happened to pick. Being told
       "correct" above a chip reading something else is a question about
       whether you were actually right. */
    if (r.pending) {
      rows.append(chipRow('Yours', [{ text: r.typed }]));
      rows.append(el('p', 'fb-grade', 'Not an exact match, so the checker is reading it…'));
      fb.append(rows);
      return;
    }
    r.hints = [];
    const shown = (r.ok && !r.graded && r.tokens && r.tokens.length === q.answer.length) ? r.tokens : q.answer;
    rows.append(chipRow('Answer', shown.map(a => ({
      text: a + suffix,
      cls: r.ok ? 'good' : '',
    }))));
    if (r.graded) {
      if (r.ok) rows.append(chipRow('Yours', [{ text: r.typed, cls: 'good' }]));
      rows.append(el('p', 'fb-grade', r.graded));
    }
    if (r.ok && q.anyOf && q.anyOf.length > 1) {
      rows.append(el('p', 'fb-gap', 'Also right here: ' + q.anyOf.filter(x => !shown.includes(x)).join(', ') + '.'));
    }
    if (!r.ok && !r.revealed && r.tokens && !(r.typed !== null && r.graded)) {
      const left = q.answer.slice();
      rows.append(chipRow('Yours', r.tokens.map((t, i) => {
        let good;
        if (q.unordered) {
          const j = left.indexOf(t);
          good = j >= 0;
          if (good) left.splice(j, 1);
        } else good = t === q.answer[i];
        return { text: t + suffix, cls: good ? '' : 'miss' };
      })));
      if (q.answer.length === 1 && r.tokens.length === 1) {
        const gap = (q.missNote && q.missNote(r.tokens[0])) || pitchGap(r.tokens[0], q.answer[0], isChord);
        if (gap) { rows.append(el('p', 'fb-gap', gap)); r.hints.push(gap); }
      } else if (q.missNote) {
        // Several parts: a line for each wrong one, saying what it actually is.
        const left2 = q.answer.slice();
        r.tokens.forEach(t => {
          const j = left2.indexOf(t);
          if (j >= 0) { left2.splice(j, 1); return; }
          const why = q.missNote(t);
          if (why) { rows.append(el('p', 'fb-gap', why)); r.hints.push(why); }
        });
      }
    }
    fb.append(rows);

    const ex = el('p', 'fb-explain');
    ex.innerHTML = q.explain;
    fb.append(ex);
    if (q.fb) fb.append(fretboard(q.fb));
    if (q.strip) fb.append(renderStrip(q.strip, q.type));
    const next = button('btn primary block fb-next', 'Next question', nextQuestion);
    fb.append(next);
    next.focus({ preventScroll: true });
  }

  /* ---------- Working: a scratch box under every question ---------- */
  function resetNotes() {
    const t = $('#qNotes');
    if (!t) return;
    t.value = '';
    t.readOnly = false;
    t.style.height = '';
    $('#notesBox').hidden = false;
    $('#notesLabel').textContent = 'Working';
  }
  // Freeze what was written at the moment of answering: that is what the
  // checker reads, so later edits would only make the two disagree.
  function sealNotes() {
    const t = $('#qNotes');
    if (!t) return '';
    const v = t.value.trim();
    t.readOnly = true;
    if (document.activeElement === t) t.blur();
    $('#notesBox').hidden = !v;
    $('#notesLabel').textContent = 'Your working';
    return v;
  }
  function growNotes() {
    const t = $('#qNotes');
    t.style.height = 'auto';
    t.style.height = Math.min(260, t.scrollHeight + 3) + 'px';
  }

  /* ---------- Typed answers ----------
     An exact match after a forgiving clean-up: case, spaces, # for ♯ and b
     for ♭, words for numbers, the obvious synonyms. Anything else goes to the
     checker, which can tell "perfect fourth" from "P4" being the same thing
     and "dominant" from "subdominant" not being. */
  const ORD_W = { first: '1st', second: '2nd', third: '3rd', fourth: '4th', fifth: '5th', sixth: '6th',
    seventh: '7th', eighth: '8th', ninth: '9th', eleventh: '11th', thirteenth: '13th', sixteenth: '16th',
    'thirty-second': '32nd', thirtysecond: '32nd' };
  const NUM_W = { zero: '0', none: '0', one: '1', two: '2', three: '3', four: '4', five: '5', six: '6',
    seven: '7', eight: '8', nine: '9', ten: '10', eleven: '11', twelve: '12', sixteen: '16' };
  const SYN = {
    'In it': ['yes', 'in', 'inside', 'in the scale', 'in the pentatonic', 'its in', 'it is'],
    'Not in it': ['no', 'not', 'out', 'outside', 'not in', 'its not', 'not in the scale', 'not in the pentatonic'],
    tonic: ['home', 't'], subdominant: ['sub dominant', 'predominant', 'pre dominant', 'sd', 's'],
    dominant: ['d'], Perfect: ['authentic', 'full', 'full close'], Plagal: ['amen'],
    Interrupted: ['deceptive'], Half: ['imperfect', 'half close'], both: ['either', 'both of them'],
    neither: ['none', 'no sus'], root: ['the root', 'r', '1', '1st'],
  };
  function norm(x) {
    let t = String(x).toLowerCase().normalize('NFKC').trim();
    t = t.replace(/♯/g, '#').replace(/♭/g, 'b').replace(/𝄪/g, '##').replace(/𝄫/g, 'bb');
    if (/^no (sharps|flats|sharps or flats|flats or sharps|accidentals)$/.test(t)) return '0';
    t = t.replace(/\bsharps?\b/g, '#').replace(/\bflats?\b/g, 'b');
    t = t.replace(/\b[a-z-]+\b/g, w => ORD_W[w] || NUM_W[w] || w);
    t = t.replace(/\b(the|a|an|its|it's|is|and|&|cadence|chord|scale|mode|key|note|notes|pentatonic|semitones?)\b/g, ' ');
    return t.replace(/[^a-z0-9#b/]+/g, '');
  }
  function synonyms(a) {
    const out = [{ v: a }];
    const iv = T.IV && T.IV[a];
    if (iv || a === 'TT') {
      out.push({ v: a, cs: true });
      if (iv) {
        out.push({ v: iv.name }, { v: iv.name.replace(/(\d)(st|nd|rd|th)/, (_, n) => ' ' + n) });
        const [ql] = iv.name.split(' ');
        out.push({ v: ql.slice(0, 3) + ' ' + iv.name.split(' ')[1] });
        out.push({ v: iv.semis + ' semitones' });
      }
      if (a === 'TT') ['tritone', 'augmented 4th', 'diminished 5th', 'aug 4th', 'dim 5th', '#4', 'b5', '6 semitones']
        .forEach(v => out.push({ v }));
    }
    (SYN[a] || []).forEach(v => out.push({ v }));
    const par = a.match(/^(.+?) \((.+)\)$/);
    if (par) { out.push({ v: par[1] }, { v: par[2] }, { v: par[2] + ' note' }); }
    const key = a.match(/^([A-G][♯♭]?) (major|minor)$/);
    if (key) out.push({ v: key[1] + (key[2] === 'minor' ? 'm' : '') }, { v: key[1] + ' ' + key[2].slice(0, 3) });
    return out;
  }
  function typedMatch(q, raw) {
    const acc = (q.anyOf && q.anyOf.length ? q.anyOf : q.answer).map(a => a + (q.answerSuffix || ''));
    const bare = (q.anyOf && q.anyOf.length ? q.anyOf : q.answer);
    const r = raw.trim(), tight = r.replace(/\s+/g, '');
    // Interval shorthand is case-sensitive: M3 is major, m3 minor.
    for (let i = 0; i < bare.length; i++) {
      if (synonyms(bare[i]).some(x => x.cs && x.v === tight)) return bare[i];
    }
    if (/^[mMPAd]\d$/.test(tight) && bare.some(a => T.IV && T.IV[a])) return null;
    const n = norm(r);
    if (!n) return null;
    for (let i = 0; i < bare.length; i++) {
      const forms = synonyms(bare[i]).concat(synonyms(acc[i]));
      if (forms.some(x => !x.cs && norm(x.v) === n)) return bare[i];
      // A one-number answer takes the number however it is dressed: "fret 7", "7th fret".
      if (/^\d+$/.test(bare[i])) {
        const nums = r.match(/\d+/g);
        if (nums && nums.length === 1 && nums[0] === bare[i]) return bare[i];
      }
    }
    return null;
  }

  /* ---------- What a question looks like as words ----------
     Used for the checker's prompt and for vocal mode: the hero is drawn on
     screen, so it has to be put into words for anything that can't see it. */
  function heroWords(q) {
    const h = q.hero;
    if (q.heroKind === 'fret') {
      const dots = (h.dots || [h]).filter(d => d && d.str);
      if (h.alt) return h.alt;
      if (!dots.length) return h.cap || `the ${T.OPEN_NAME[h.line] || ''} string`;
      return dots.map(d => `string ${d.str} (${T.OPEN_NAME[d.str]}), ${d.fret ? 'fret ' + d.fret : 'open'}`).join('; ')
        + (h.cap ? ` — ${h.cap}` : '');
    }
    if (q.heroKind === 'seq' || q.heroKind === 'set') return h.map(x => (typeof x === 'string' ? x : `${x.t} (${x.c})`)).join('  ');
    if (q.heroKind === 'pair') return `${h[0]} → ${h[2]}`;
    return String(h);
  }
  function questionWords(q) {
    return [q.context, heroWords(q) + (q.heroCap ? ` (${q.heroCap})` : ''), q.sub].filter(Boolean).join(' · ');
  }
  const plain = html => String(html || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');

  // The last thirty attempts, so the checker can see a mistake that repeats.
  function remember(q, r) {
    S.recent.push({
      drill: q.drill, q: questionWords(q), answer: q.answer.join(' ') + (q.answerSuffix || ''),
      given: r.revealed ? '(skipped)' : r.typed !== null && r.typed !== undefined ? r.typed
        : (r.tokens || []).join(' ') + (q.answerSuffix || ''),
      ok: r.ok,
    });
    if (S.recent.length > 30) S.recent.shift();
  }

  /* ---------- The AI checker ---------- */
  const checkerOn = () => S.settings.checker !== 'off' && Checker.status === 'ready';
  function stopChecker() {
    const ck = S.ck;
    if (ck.grade) { ck.grade.abort(); ck.grade = null; }
    if (ck.review) { ck.review.ctl.abort(); clearInterval(ck.review.tick); ck.review = null; }
    const box = $('#review');
    if (box) { box.hidden = true; box.innerHTML = ''; }
  }

  function gradePrompt(q, raw) {
    const acc = (q.anyOf && q.anyOf.length ? q.anyOf : q.answer).map(a => a + (q.answerSuffix || ''));
    return [
      'You are grading one typed answer in a music-theory quiz for a guitarist.',
      'Decide whether the student\'s answer states the same thing as an accepted answer.',
      '',
      `Drill: ${Q.DRILL[q.drill].name}`,
      `Question: ${questionWords(q)}`,
      `Accepted answer${acc.length > 1 ? 's' : ''}: ${acc.join(' | ')}`,
      `How the app explains it: ${plain(q.explain)}`,
      `Student typed: "${raw}"`,
      '',
      'Rules:',
      '- Correct only if it means exactly the same as an accepted answer. Other wording, abbreviations, ordinal words, # for ♯, b for ♭, and small typos in ordinary words are fine.',
      '- A different note, number, degree, interval, chord, key, mode or term is wrong, even if close. A wrong or missing sharp or flat is wrong. Naming two possibilities is wrong.',
      '- An answer that is right but explained with extra words is still right.',
      '',
      'Reply with only JSON: {"correct": true or false, "closeness": 0-100, "why": "one short sentence"}',
    ].join('\n');
  }
  async function gradeTyped(q, base) {
    const ctl = new AbortController();
    S.ck.grade = ctl;
    let verdict = null, note = '';
    try {
      const g = await Checker.grade(gradePrompt(q, base.typed), { signal: ctl.signal });
      if (g && typeof g === 'object' && typeof g.correct === 'boolean') {
        verdict = g.correct;
        const why = typeof g.why === 'string' ? g.why.trim() : '';
        note = g.correct
          ? `Not an exact match, but the checker accepted it${why ? ': ' + why : '.'}`
          : `The checker read it and marked it wrong${why ? ': ' + why : '.'}`;
      }
    } catch (e) {
      if (e && e.code === 'cancelled') return;
      note = 'The checker could not be reached, so it was marked against the exact answer.';
    }
    if (S.ck.grade !== ctl) return;
    S.ck.grade = null;
    if (S.q !== q) return;
    const ok = verdict === true;
    finishAnswer(q, Object.assign({}, base, { ok, enh: false, graded: note || 'Marked against the exact answer.' }));
  }

  function reviewPrompt(q, r) {
    const key = q.key ? `${T.keyName(q.key)} (${T.scale(q.key).map(T.name).join(' ')})` : 'none';
    const acc = (q.anyOf && q.anyOf.length ? q.anyOf : q.answer).map(a => a + (q.answerSuffix || ''));
    const given = r.revealed ? '(skipped — tapped Show answer)'
      : r.timedOut && !(r.tokens && r.tokens.length) && !r.typed ? '(nothing — the clock ran out)'
      : r.typed !== null && r.typed !== undefined ? `"${r.typed}" (typed)`
      : (r.tokens || []).map(t => t + (q.answerSuffix || '')).join('  ');
    const verdict = r.revealed ? 'skipped' : r.timedOut ? 'out of time'
      : r.ok ? 'correct' : r.enh ? 'right pitch, wrong spelling' : 'wrong';
    const st = S.stats.drills[q.drill];
    const past = S.recent.slice(0, -1).filter(x => x.drill === q.drill).slice(-6)
      .map(x => `- ${x.q} → answer ${x.answer}; he gave ${x.given} (${x.ok ? 'right' : 'wrong'})`);
    const clock = clockFor(q);
    return [
      'You are the answer checker in Gooby Goober, a music-theory quiz app for a guitarist. He asked for a checker "as prolific as possible": go deep on his reasoning, how close he was, exactly what went wrong, and how to get it right next time.',
      '',
      'How to write:',
      '- Talk to him directly as "you". Direct and specific. No hedging, no filler, no praise padding, no restating the question.',
      '- Scale degrees as bare numbers with ♭ or ♯: 1, 4, 5, ♭3, ♭7. Never Roman numerals. Never quality suffixes on degree numbers (not "6m" or "2m"). Use the ♯ and ♭ symbols.',
      '- He plays guitar. Where it genuinely helps, tie it to the neck: shapes, strings, frets, CAGED, how it sounds or feels under the fingers.',
      '- Work the question out yourself from scratch first. Do not just trust the app\'s answer.',
      '- Thorough, but every sentence must teach something. Usually 180–380 words in total.',
      '',
      `Drill: ${Q.DRILL[q.drill].name} (${Q.DRILL[q.drill].group}) — e.g. ${Q.DRILL[q.drill].eg}`,
      `Difficulty: ${levelInfo().name}`,
      `Key: ${key}`,
      `Question as shown: ${questionWords(q)}`,
      `Correct answer${acc.length > 1 ? 's' : ''}: ${acc.join(' | ')}`,
      `The app's explanation: ${plain(q.explain)}`,
      r.hints && r.hints.length ? `The app also told him: ${r.hints.join(' ')}` : null,
      r.graded ? `Grading note: ${r.graded}` : null,
      '',
      `His answer: ${given}`,
      `Verdict: ${verdict}`,
      `Time taken: ${(r.dt / 1000).toFixed(1)} s${clock ? ` (clock was ${clock / 1000} s)` : ' (no clock)'}`,
      `His written working: ${r.notes ? '\n"""\n' + r.notes.slice(0, 4000) + '\n"""' : 'none written'}`,
      st && st.n ? `His record on this drill: ${st.c} right out of ${st.n}.` : null,
      past.length ? 'His recent attempts at this drill, oldest first:\n' + past.join('\n') : null,
      '',
      'Reply in exactly this shape: plain text, these headings, nothing before the first line.',
      '',
      'VERDICT: correct | close | wrong | skipped',
      'CLOSENESS: <a whole number 0-100: how much of the right thinking his answer shows; 100 means fully right with sound reasoning>',
      '## Your reasoning',
      '<If he wrote working, go through it step by step: what was sound, the exact step where it went off. If he wrote none, reconstruct the most likely line of thought behind the answer he gave, say plainly that it is your reconstruction ("Most likely you…"), and judge that. For a right answer, check the method held up and was not luck.>',
      '## How close you were',
      '<The concrete distance: e.g. one sharp short, right root but wrong quality, a whole step off, right shape on the wrong string, right idea counted from the wrong note. Say which part was right.>',
      '## What went wrong',
      '<One bullet per mistake, naming the misconception behind it, not just the symptom. If any mistake repeats across his recent attempts, call the pattern out. If nothing went wrong, say what would make it faster or surer.>',
      '## How to get it next time',
      '<The method as numbered steps that work for every question of this kind, worked through on this question. Then one line starting "Remember:" with a rule of thumb, shortcut or picture on the neck.>',
      '## Quick self-check',
      '<One new question of the same kind with a different key or note. Then on its own line: "Answer: …" with a one-line why.>',
      '',
      'Only if you are sure the app\'s answer is wrong or the question is misleading, add a final "## Question check" saying exactly why. Otherwise leave that heading out.',

  }

  function startReview(q, r) {
    if (!checkerOn()) return false;
    const mode = S.settings.checker;
    if (mode === 'wrong' && r.ok) return false;
    runReview(q, r);
    return true;
  }
  function runReview(q, r) {
    const box = $('#review');
    if (S.ck.review) { S.ck.review.ctl.abort(); clearInterval(S.ck.review.tick); }
    const ctl = new AbortController();
    const job = { ctl, q, r, text: '', t0: performance.now(), tick: 0 };
    S.ck.review = job;
    box.hidden = false;
    box.innerHTML = '';
    const head = el('div', 'rv-head');
    head.append(el('p', 'rv-title', 'Checker'));
    const stop = button('rv-stop', 'Stop', () => { ctl.abort(); });
    head.append(stop);
    const wait = el('div', 'rv-wait');
    const dots = el('span', 'rv-dots');
    dots.append(el('i'), el('i'), el('i'));
    const waitText = el('span', null, 'Going through your answer…');
    wait.append(dots, waitText);
    const body = el('div', 'rv-body');
    box.append(head, wait, body);
    job.tick = setInterval(() => {
      const s = Math.round((performance.now() - job.t0) / 1000);
      if (s >= 3) waitText.textContent = `Going through your answer… ${s}s`;
    }, 1000);
    const done = () => { clearInterval(job.tick); wait.remove(); stop.remove(); };
    Checker.review(reviewPrompt(q, r), {
      signal: ctl.signal,
      onText: ({ text }) => {
        if (S.ck.review !== job) return;
        job.text = text;
        if (wait.isConnected) { wait.remove(); clearInterval(job.tick); }
        renderReview(body, text, false);
      },
    }).then(res => {
      if (S.ck.review !== job) return;
      done();
      job.text = res.text;
      renderReview(body, res.text, true);
      if (res.truncated) body.append(el('p', 'rv-note', 'Cut short at the length limit.'));
    }).catch(e => {
      if (S.ck.review !== job) return;
      done();

      if (code === 'cancelled') {
        if (e.text) { renderReview(body, e.text, true); body.append(el('p', 'rv-note', 'Stopped.')); }
        else box.hidden = true;
        return;
      }
      if (e && e.text && code !== 'refused') renderReview(body, e.text, true);
      else body.innerHTML = '';
      body.append(el('p', 'rv-err', reviewError(code)));
      if (['rate_limited', 'upstream_error', 'empty_completion', 'network', 'invalid_json'].includes(code) || !code) {
        body.append(button('rv-retry', 'Try again', () => runReview(q, r)));
      }

    });
  }
  function reviewError(code) {
    return ({
      not_granted: 'The checker was not allowed to use Claude, so it is off for this visit. Allow it from this page\'s permissions to bring it back.',
      sampling_disabled: 'Claude is not available on this account, so the checker is off.',
      capability_disabled: 'The checker cannot run in this view.',
      not_declared: 'The checker cannot run in this view.',
      capability_removed: 'This app version cannot run the checker — update the Claude app.',
      rate_limited: Checker.route === 'gemini' ? 'Gemini\'s free allowance is used up for now. Try again later.' : 'Usage limit reached for now. Try again in a bit.',
      session_expired: 'Sign in to Claude again to use the checker.',
      refused: 'Claude declined to review this one.',
      bad_key: Checker.route === 'gemini' ? 'Gemini rejected the key. Check it in Settings.' : 'The API key was rejected. Check it in Settings.',
      no_credit: 'The API account has no credit left.',
      no_key: 'Add an API key in Settings to use the checker here.',
      invalid_request: 'The request was refused — the details are in the console.',
      network: 'Could not reach Claude — check the connection.',
    })[code] || 'The checker could not finish this one.';
  }

  // The reply's own structure, drawn as it streams in. Only a small, safe
  // subset of Markdown: headings, bullets, numbered lists and bold.
  function parseReview(text) {
    const out = { verdict: null, close: null, secs: [], pre: [] };
    let cur = null;
    for (const raw of String(text).split('\n')) {
      const line = raw.replace(/\s+$/, '');
      let m;
      if (!out.secs.length && (m = line.match(/^\s*\**VERDICT\**:\s*\**\s*([a-z ]+)/i))) { out.verdict = m[1].trim().toLowerCase(); continue; }
      if (!out.secs.length && (m = line.match(/^\s*\**CLOSENESS\**:\s*\**\s*(\d{1,3})/i))) { out.close = Math.min(100, +m[1]); continue; }
      if ((m = line.match(/^\s*#{1,4}\s+(.+?)\s*#*$/))) { cur = { title: m[1].replace(/\*\*/g, ''), lines: [] }; out.secs.push(cur); continue; }
      (cur ? cur.lines : out.pre).push(line);
    }
    return out;
  }
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<b>$1</b>');
  function blocks(lines, into, selfCheck) {
    let list = null, para = [];
    const flushPara = () => { if (para.length) { const p = el('p'); p.innerHTML = inline(para.join(' ')); into.append(p); para = []; } };
    const flushList = () => { list = null; };
    lines.forEach(line => {
      const t = line.trim();
      if (!t) { flushPara(); flushList(); return; }
      let m;
      if (selfCheck && (m = t.match(/^\**answer\**:\s*(.*)$/i))) {
        flushPara(); flushList();
        const d = el('details', 'rv-ans');
        const s = el('summary', null, 'Show answer');
        const p = el('p');
        p.innerHTML = inline(m[1]);
        d.append(s, p);
        into.append(d);
        return;
      }
      if ((m = t.match(/^[-*•]\s+(.*)$/))) {
        flushPara();
        if (!list || list.tagName !== 'UL') { list = el('ul'); into.append(list); }
        const li = el('li'); li.innerHTML = inline(m[1]); list.append(li);
        return;
      }
      if ((m = t.match(/^(\d+)[.)]\s+(.*)$/))) {
        flushPara();
        if (!list || list.tagName !== 'OL') { list = el('ol'); into.append(list); }
        const li = el('li'); li.innerHTML = inline(m[2]); list.append(li);
        return;
      }
      flushList();
      para.push(t);
    });
    flushPara();
  }
  function renderReview(body, text, final) {
    const p = parseReview(text);
    body.innerHTML = '';
    if (p.close !== null) {
      const c = el('div', 'rv-close');
      const row = el('div', 'rv-close-row');
      row.append(el('span', null, 'How close'), el('b', null, p.close + '%'));
      const bar = el('div', 'rv-bar ' + (p.close >= 80 ? 'hi' : p.close >= 45 ? 'mid' : 'lo'));
      const fill = el('i');
      fill.style.width = p.close + '%';
      bar.append(fill);
      c.append(row, bar);
      body.append(c);
    }
    if (p.pre.some(l => l.trim())) { const sec = el('div', 'rv-sec'); blocks(p.pre, sec, false); body.append(sec); }
    p.secs.forEach(s => {
      const flag = /question check/i.test(s.title);
      const sec = el('div', 'rv-sec' + (flag ? ' flag' : ''));
      sec.append(el('h3', null, s.title));
      blocks(s.lines, sec, /self.?check/i.test(s.title));
      body.append(sec);
    });
    if (final && !p.secs.length && !p.pre.some(l => l.trim())) body.append(el('p', 'rv-err', 'The checker sent back nothing readable.'));
  }

  /* ---------- Vocal mode ----------
     The question is read out; a held button listens for the answer and
     submits what it heard when let go. */
  const voiceOn = () => !!S.settings.voice && Voice.canSpeak;
  const holdOn = () => (voiceOn() || !!S.settings.holdMic) && Voice.canListen;
  const questionLine = q => Voice.speakable([Q.DRILL[q.drill].name, q.context,
    heroWords(q) + (q.heroCap ? ` (${q.heroCap})` : ''), q.sub].filter(Boolean).join('. '));
  function sayQuestion() {
    if (!voiceOn() || S.atStart || S.view !== 'quiz' || !S.q || S.answered) return;
    speakOut(questionLine(S.q));
  }
  /* Every way of missing ends in the same sentence, "It's …", so the one
     sentence asked for ahead of time covers all of them. */
  const answerLine = q => `It's ${q.answer.map(a => a + (q.answerSuffix || '')).join(', ')}.`;
  function sayVerdict(q, r) {
    if (!voiceOn() || r.pending) return;
    const line = r.ok ? 'Correct.' : r.revealed ? answerLine(q)
      : r.timedOut ? `Out of time. ${answerLine(q)}` : `Not quite. ${answerLine(q)}`;
    speakOut(Voice.speakable(line));
  }
  /* The one way anything is spoken. Gemini's designed voice when it is set
     up; the device's English voice when it is not, or when Gemini can't
     answer (the day's free allowance gone, offline) — and then it says why,
     once, so the change of voice is never a mystery. */
  const audioEl = typeof Audio !== 'undefined' ? new Audio() : null;
  const her = Gemini.player(audioEl);
  const geminiVoice = () => S.settings.voiceEngine === 'gemini' && Gemini.key() && !!(Gemini.voice() || {}).id;
  function stopSpeech() {
    Voice.hush();
    her.stop();
  }
  function playBlob(blob) {
    Voice.hush();
    her.one(blob);
  }
  // Her, a sentence at a time; whatever she can't say, the device finishes.
  function speakOut(text) {
    stopSpeech();
    if (!text) return;
    if (!geminiVoice()) { Voice.speak(text, { voiceName: S.settings.voiceName }); return; }
    her.say(text, { onFail: (e, rest) => { voiceIssue(e); Voice.speak(rest, { voiceName: S.settings.voiceName }); } });
  }

  /* ---------- asking ahead ----------
     She can only start straight away if her words are already here. So the
     moment a question is up, the NEXT question is made — on copies of the
     shuffle bags, so nothing is drawn for real — and its words are fetched,
     along with this question's answer in case it is missed. When Next comes,
     that question is used only if nothing has changed since (no settings
     touched, no bag drawn from or rebuilt); the copies' draws then become
     the real ones. Anything changed, it is thrown away and a fresh one made,
     exactly as before. Only done while her Gemini voice is on: nothing else
     needs it. */
  const bagMark = b => [b.pool.join(','), b.pass, b.drawn, String(b.last)].join('|');
  const planMark = () => JSON.stringify([S.settings, profile()]);
  function planAhead() {
    S.upcoming = null;
    if (!voiceOn() || !geminiVoice() || S.atStart || !S.q || S.answered) return;
    Gemini.prefetch(clockFor(S.q) ? 'Correct. Not quite. Out of time.' : 'Correct. Not quite.');
    Gemini.prefetch(Voice.speakable(answerLine(S.q)));
    const real = S.bags, names = Object.keys(real), copy = {};
    names.forEach(n => {
      const b = real[n];
      copy[n] = Object.assign(Object.create(Object.getPrototypeOf(b)), b, { items: b.items.slice(), pool: b.pool.slice() });
    });
    let q = null;
    S.bags = copy;
    try { q = Q.make(copy.drill.next(), ctx()); } catch (e) { q = null; } finally { S.bags = real; }
    if (!q) return;
    S.ahead.made++;
    S.upcoming = { q, copy, marks: names.map(n => [n, real[n], bagMark(real[n])]), plan: planMark() };
    Gemini.prefetch(questionLine(q));
  }
  function takeUpcoming() {
    const u = S.upcoming;
    S.upcoming = null;
    if (!u) return null;
    // Why one was thrown away is kept for the tests (ahead().miss).
    if (u.plan !== planMark()) { S.ahead.miss = 'settings'; return null; }
    const moved = u.marks.find(([n, b, m]) => S.bags[n] !== b || bagMark(b) !== m);
    if (moved || Object.keys(S.bags).length !== u.marks.length) { S.ahead.miss = 'bag ' + (moved ? moved[0] : '?'); return null; }
    u.marks.forEach(([n, b]) => { const c = u.copy[n]; b.pool = c.pool; b.pass = c.pass; b.drawn = c.drawn; b.last = c.last; });
    S.ahead.used++;
    return u.q;
  }
  function voiceIssue(e) {
    const msg = geminiError(e, 'voice');
    S.voiceIssue = msg;
    const h = $('#heard');
    if (h && !$('#voiceBar').hidden) h.textContent = msg;
    const st = $('#gemStatus');
    if (st) st.textContent = msg;
  }
  function geminiError(e, what) {
    const code = e && e.code;
    const fall = what === 'voice' ? ' Using the device voice for now.' : '';
    return ({
      rate_limited: 'Gemini\'s free allowance is used up for now.' + fall,
      bad_key: 'Gemini rejected the key — check it in Settings.' + fall,
      no_key: 'No Gemini key yet — add one in Settings.' + fall,
      no_voice: 'The Gemini voice hasn\'t been created yet — Settings → Vocal mode.' + fall,
      network: 'Couldn\'t reach Gemini — check the connection.' + fall,
    })[code] || `Gemini couldn't do that (${(e && e.message) || 'unknown error'}).` + fall;
  }
  // iOS plays sound only after a tap has played some; this is that tap.
  const SILENT = (() => {
    try {
      const h = new ArrayBuffer(44 + 800), v = new DataView(h);
      const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
      w(0, 'RIFF'); v.setUint32(4, 36 + 800, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
      v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 16000, true);
      v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, 800, true);
      return URL.createObjectURL(new Blob([h], { type: 'audio/wav' }));

  function unlockAudio() {

    /* Marked at once, not when the silent clip finishes: she may start the
       very next moment, and a second unlock would swap her line out for
       silence mid-word. A play() started from a tap is what iOS needs. */
    audioEl.dataset.unlocked = '1';

      audioEl.src = SILENT;
      const p = audioEl.play();

    } catch (e) { /* ignore */ }
  }
  function renderVoiceBar() {
    const bar = $('#voiceBar');

    bar.hidden = !on;

    document.querySelector('#view-quiz .qcard').classList.toggle('has-say', voiceOn());
    if (!on) return;

    btn.querySelector('.hold-main').textContent = 'Listening…';
    S.heard = '';
    $('#heard').textContent = '';
    const lang = /^en/i.test(navigator.language || '') ? navigator.language : 'en-NZ';

      lang,
      onHear: t => { S.heard = t; $('#heard').textContent = t; },
      onDone: t => { S.listening = null; resetHold(); useHeard(t); },
      onError: k => {

          silence: 'Heard nothing — hold, speak, then let go.',
          nomic: 'No microphone found.',
          unsupported: 'This browser cannot listen. Safari or Chrome can.',

  }

  }
  // Turn what was heard into the same taps the keypads make.
  function useHeard(text) {

    const say = msg => { $('#heard').textContent = `Heard “${t}”. ${msg}`; };
    if (q.input === 'choice') {
      const inp = $('#ansText');

      return;
    }
    let toks = [];
    if (q.input === 'note' || q.input === 'notes') toks = Voice.parseNotes(t);
    else if (q.input === 'degree') toks = Voice.parseDegrees(t, T.MODES[q.degreeMode].labels);
    else if (q.input === 'interval') { const iv = Voice.parseInterval(t); if (iv) toks = [iv]; }

      E.pending = null;
      toks.forEach(x => { if (E.tokens.length < q.slots) E.tokens.push(x); });
      renderSlots();
      updateActions();
      if (E.tokens.length >= q.slots) return submit(E.tokens.slice());
      say(`${q.slots - E.tokens.length} more to go — hold again for the rest.`);
      return;

    submit([toks[0]]);
  }

  /* ---------- Settings for the checker and the voice ---------- */
  function refreshCheckerNote() {
    const n = $('#ckNote');
    if (!n) return;
    const route = Checker.route;
    n.textContent = Checker.status === 'loading' ? 'Connecting…'
      : route === 'claude' ? 'Runs on your Claude account. The first check asks your permission.'
      : route === 'api' ? `Runs on your Anthropic API key (${Checker.MODELS.review} for reviews). Billed to that account.`
      : route === 'gemini' ? `Runs free on your Gemini key (${Gemini.MODELS.review[0]} for reviews, a lighter model once the day's free allowance runs out). Reviews are less sharp than Claude's.`
      : Checker.reason ? reviewError(Checker.reason)
      : Checker.inClaude ? 'Claude is not available to this page right now.'
      : 'Not connected. Add a free Gemini key above, or an Anthropic API key below.';
    const kb = $('#keyBox');
    if (kb) kb.hidden = route === 'claude';
    const ks = $('#keyState');
    if (ks) ks.textContent = Checker.hasKey() ? 'A key is saved in this browser.' : 'No key saved.';
    const rm = $('#keyRemove');
    if (rm) rm.hidden = !Checker.hasKey();
    const gs = $('#gemState');
    if (gs) gs.textContent = Gemini.key() ? 'A Gemini key is saved in this browser.' : 'No Gemini key saved.';

  function renderStrip(st, type) {
    const key = st.key, sc = T.scale(key);
    const names = st.show === 'notes' ? sc.map(T.name)
      : T.chordsOf(key, type || 'triad').map(c => (c ? c.name : '–'));
    const longest = Math.max(...names.map(n => [...n].length));
    // Long chord names (G♯m11, D♯m7♭5) stack root over suffix rather than shrink
    // to nothing in a 7-across row.
    const split = st.show !== 'notes' && longest >= (window.innerWidth < 372 ? 4 : 5);
    const wrap = el('div', 'strip' + (split ? ' split' : ''));
    wrap.append(el('p', 'strip-title', T.keyName(key)));
    const row = el('div', 'strip-row');
    names.forEach((nm, d) => {
      const cls = 'cell' + (st.hi.includes(d) ? ' hi' : '') + (st.from === d ? ' from' : '') + (nm === '–' ? ' off' : '');
      const c = el('div', cls);
      const nmEl = el('span', 'nm');
      if (split && nm !== '–') {
        const parts = T.splitChord(nm);
        const suf = el('i', null, parts.suffix || '\u00a0');
        const len = [...parts.suffix].length;
        // maj13 and m7♭5 would be clipped at phone width, so long suffixes shrink.
        if (len >= 5) suf.style.fontSize = '9px';
        else if (len === 4) suf.style.fontSize = '10px';
        nmEl.append(el('b', null, parts.root), suf);
      } else {
        nmEl.textContent = nm;
        if (!split && longest >= 4) nmEl.style.fontSize = '12px';
      }
      c.append(el('span', 'deg', T.degLabel(key.mode, d)), nmEl);
      row.append(c);
    });
    wrap.append(row);
    return wrap;
  }

  /* The key laid out across the whole neck. This is the view a guitarist
     actually wants — not "the 6 of E♭ is C" but where every one of those
     notes is under the hand — and it is the one thing a chord table can
     never show. Degrees rather than note names, because the shape is the
     transferable part and the letters are not. */
  function neckMap(key, degs) {
    const sc = T.scale(key);
    const show = degs || [0, 1, 2, 3, 4, 5, 6];
    const dots = [];
    for (let st = 1; st <= 6; st++) {
      for (let f = 0; f <= 12; f++) {
        const d = sc.findIndex(nt => T.fretFor(st, T.pc(nt)) === f % 12);
        if (d < 0 || !show.includes(d)) continue;
        dots.push({ str: st, fret: f, text: T.degLabel(key.mode, d),
          kind: d === 0 ? 'to' : 'from' });
      }
    }
    return fretboard({ dots, from: 0, span: 12, cap: '', alt: `${T.keyName(key)} across the neck` });
  }

    return T.makeKey(E.mode, E.slot, E.sp);

    tb.append(body);
    wrap.append(tb);
    g2.append(wrap);
    g2.append(el('p', 'group-note', 'Scroll sideways for the wider shapes.'));
    v.append(g2);

    const g3 = group('Colour outside the key');
    const bor = el('div', 'chiprow');
    T.borrowsFor(key).forEach(ch => {
      const b = el('div', 'bigchip');
      b.append(el('b', null, ch.name), el('i', null, ch.spec.label));
      bor.append(b);
    });
    g3.append(el('p', 'subhead', 'Borrowed from the parallel mode'), bor);
    const sec = el('div', 'chiprow');
    T.secondariesFor(key).forEach(sd => {
      const b = el('div', 'bigchip');
      b.append(el('b', null, sd.name), el('i', null, `5 of the ${T.degLabel(key.mode, sd.deg)} → ${sd.target.name}`));
      sec.append(b);
    });
    g3.append(el('p', 'subhead', 'Secondary dominants'), sec);
    v.append(g3);

    const gN = group('On the neck');
    const nTabs = el('div', 'seg wide neck-tabs');
    const VIEWS = [
      { id: 'all', name: 'Whole key', degs: null },
      { id: 'pent', name: 'Pentatonic', degs: T.PENTA[key.mode].degs },
      { id: 'triad', name: '1 3 5', degs: [0, 2, 4] },
    ];
    const nBox = el('div', 'neck-box');
    const drawNeck = id => {
      const v = VIEWS.find(x => x.id === id) || VIEWS[0];
      nBox.innerHTML = '';
      nBox.append(neckMap(key, v.degs));
      [...nTabs.children].forEach(b => b.setAttribute('aria-selected', String(b.dataset.neck === id)));
      S.explore.neck = id;
    };
    VIEWS.forEach(v => {
      const b = button(null, v.name, () => drawNeck(v.id));
      b.dataset.neck = v.id;
      b.setAttribute('role', 'tab');
      nTabs.append(b);
    });
    gN.append(nTabs, nBox);
    drawNeck(E.neck || 'all');
    gN.append(el('p', 'group-note', 'Filled dot is the 1. Every other degree is hollow. '
      + 'The shape is the same in every key — only where it starts moves.'));
    v.append(gN);

    /* The CAGED chain for this key's tonic. The shapes always run C A G E D
       and always in that cyclic order — what changes between keys is only
       which one lands in open position. Laying them out by where the HAND
       goes rather than where the root is, is what makes the chain visible:
       two neighbouring shapes often share a root note, so ordering by root
       collapses them onto each other and hides the pattern. */
    const gC = group('CAGED chain for ' + T.name(key.tonic));
    const tonicPc = T.pc(key.tonic);
    const chain = T.CAGED.map(sh => {
      const root = T.fretFor(sh.str, tonicPc);
      let hand = root - sh.nut;
      if (hand < 0) hand += 12;
      return { id: sh.id, hand, root: hand + sh.nut, str: sh.str };
    }).sort((a, b) => a.hand - b.hand);
    const cRow = el('div', 'caged-row');
    chain.forEach(c => {
      const card = el('div', 'caged-card' + (c.hand === 0 ? ' open' : ''));
      card.append(
        el('span', 'cc-shape', c.id),
        el('span', 'cc-hand', c.hand === 0 ? 'open' : 'fret ' + c.hand),
        el('span', 'cc-root', `root ${c.str}/${c.root}`),
      );
      cRow.append(card);
    });
    gC.append(cRow);
    gC.append(el('p', 'group-note', `Five shapes, one chord. ${chain.map(c => c.id).join(' → ')} `
      + `going up the neck, then it repeats an octave higher. Neighbouring shapes share a root note, `
      + `which is what lets you slide from one into the next without the chord changing.`));
    v.append(gC);

    const gM = group('Modes of this key');
    const mt = el('table', 'modes-table');
    const mh = el('tr');
    ['From', 'Mode', 'Degrees', 'Tell'].forEach(h => mh.append(el('th', null, h)));
    mt.append(el('thead').appendChild(mh).parentNode);
    const mb = el('tbody');
    const parent = key.mode === 'major' ? key : T.parallelOf(key);
    const pscale = T.scale(key);
    T.MODES7.forEach((m, i) => {
      // The mode rooted on each degree OF THIS KEY, in this key's own order.
      const d = key.mode === 'major' ? i : T.mod(i + 2, 7);
      const idx = key.mode === 'major' ? i : T.mod(d + 5, 7);
      const mm = T.MODES7[idx];
      const tr = el('tr');
      tr.append(el('td', 'mt-from', T.name(pscale[d]) + ' · ' + T.degLabel(key.mode, d)));
      tr.append(el('td', 'mt-name', mm.name));
      tr.append(el('td', 'mt-degs', mm.labels.join(' ')));
      tr.append(el('td', 'mt-tell', mm.char || '—'));
      mb.append(tr);
    });
    mt.append(mb);
    const mw = el('div', 'table-wrap');
    mw.append(mt);
    gM.append(mw);
    gM.append(el('p', 'group-note', 'Same seven notes every row. What changes is which one you '
      + 'treat as home, and the Tell column is the note that gives each away.'));
    v.append(gM);

    const g4 = group('Progressions in this key');
    const pr = el('div', 'chiprow');
    const triads = T.chordsOf(key, 'triad');
    Q.PROGS[key.mode].slice(0, 10).forEach(degs => {
      const chords = degs.map(x => triads[x]);
      const b = el('div', 'bigchip wide');
      b.append(el('b', null, chords.map(c => c.name).join('  ')), el('i', null, degs.map(x => T.degLabel(key.mode, x)).join(' ')));
      pr.append(b);
    });
    g4.append(pr);
    g4.append(el('p', 'group-note', 'Degrees underneath, so the shape transfers to any key.'));
    v.append(g4);
  }

  /* ---------- Settings view ---------- */
  function segmented(name, options) {
    const s = el('div', 'seg wide');
    s.setAttribute('role', 'group');
    options.forEach(([val, label]) => {
      const b = button(null, label, () => changeSetting(name, val));
      b.dataset.setting = name;
      b.dataset.value = String(val);
      s.append(b);
    });
    return s;
  }
  let swCount = 0;
  function switchRow(label, sub, get, set) {
    const row = el('div', 'row');
    const main = el('div', 'row-main');
    const id = 'swl' + ++swCount;
    const l = el('p', 'row-label', label);
    l.id = id;
    main.append(l);
    if (sub) main.append(el('p', 'row-sub', sub));
    const sw = button('switch', null, () => {
      set(!get());
      refreshSettings();
    });
    sw.setAttribute('role', 'switch');
    sw.setAttribute('aria-labelledby', id);
    sw._get = get;
    row.addEventListener('click', e => {
      if (e.target !== sw) sw.click();
    });
    row.style.cursor = 'pointer';
    row.append(main, sw);
    return row;
  }
  function buildSettings() {
    const v = $('#view-settings');
    v.innerHTML = '';
    const g0 = group('Difficulty');
    g0.append(segmented('level', LEVELS.map(l => [l.id, l.short || l.name])));
    g0.append(el('p', 'group-note', 'Also picked on the start screen. Easy: simple keys, triads, '

      + 'Custom: you set each dial. Typed answers get 5 extra seconds on a clock.'));
    const cs = customEditor(null);
    cs.id = 'customSettings';
    cs.hidden = S.settings.level !== 'custom';
    g0.append(cs);
    v.append(g0);
    const g1 = group('Keys');
    g1.append(segmented('mode', [['major', 'Major'], ['minor', 'Minor'], ['both', 'Both']]));
    const n1 = el('p', 'group-note', 'Every pass covers each selected key once, in random order.');
    g1.append(n1);
    g1.append(el('p', 'subhead', 'Focus'));
    g1.append(segmented('focus', [['all', 'All 24'], ['guitar', 'Guitar keys'], ['weak', 'Weak keys']]));
    g1.append(el('p', 'group-note', 'Guitar keys is C G D A E F and their relative minors — where '
      + 'the open shapes live. Weak keys narrows each pass to the ones under 90%, untried included.'));
    const g2 = group('Chords');
    const l2 = el('div', 'list');
    Q.TYPE_SETTINGS.forEach(t => l2.append(switchRow(t.name, t.eg, () => S.settings.types[t.id], val => setType(t.id, val))));
    g2.append(l2);
    const tn = el('p', 'group-note');
    tn.id = 'typeNote';
    tn.textContent = '6ths, 9ths, 11ths and 13ths only fit some degrees. The strip under each answer shows which.';
    g2.append(tn);
    const g3 = group('Drills');
    const pre = el('div', 'presets');
    PRESETS.forEach(p => pre.append(button('preset', p.name, () => applyPreset(p))));
    g3.append(pre);
    g3.append(el('p', 'group-note', 'A preset switches the drills below; tweak them afterwards as you like.'));
    /* Forty-one switches in one column is a four-thousand-pixel scroll, and
       the thing you came here to change is somewhere in the middle of it. So
       each group folds, shows how many of its drills are on, and carries a
       control to turn the whole group on or off without opening it. */
    const list = el('div', 'list drill-list');
    Q.GROUPS.forEach(grp => {
      const inGroup = Q.DRILLS.filter(d => d.group === grp);
      const wrap = el('details', 'drill-group');
      wrap.dataset.group = grp;
      const sum = el('summary');
      sum.append(el('span', 'dg-name', grp), el('span', 'dg-count'));
      wrap.append(sum);
      const body = el('div', 'dg-body');
      const all = el('div', 'dg-all');
      all.append(
        button('btn text', 'All on', e => { e.preventDefault(); setGroup(grp, true); }),
        button('btn text', 'All off', e => { e.preventDefault(); setGroup(grp, false); }),
      );
      body.append(all);
      inGroup.forEach(d =>
        body.append(switchRow(d.name, d.eg, () => S.settings.drills[d.id], val => setDrill(d.id, val))));
      wrap.append(body);
      list.append(wrap);
    });
    g3.append(list);
    const dn = el('p', 'group-note');
    dn.id = 'drillNote';
    dn.hidden = true;
    g3.append(dn);
    const g4 = group('Flow');
    const l4 = el('div', 'list');
    l4.append(switchRow('Move on automatically', 'After a correct answer — waits while the checker writes', () => S.settings.auto, val => {
      S.settings.auto = val;

    }));
    g4.append(l4);
    v.append(g1, g2, g3, g4);
    answerSettings(v);
    geminiSettings(v);
    checkerSettings(v);
