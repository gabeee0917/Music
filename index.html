<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Gooby Goober</title>
<style>
:root {
  --canvas: #F2F2F7;
  --surface: #FFFFFF;
  --ink: #1D1D1F;
  --ink-2: #6E6E73;
  --ink-3: #AEAEB2;
  --hair: rgba(60, 60, 67, 0.16);
  --accent: #0071E3;
  --accent-ink: #FFFFFF;
  --accent-tint: rgba(0, 113, 227, 0.1);
  --good: #1E8E3E;
  --good-tint: rgba(52, 199, 89, 0.18);
  --bad: #D70015;
  --bad-tint: rgba(255, 59, 48, 0.13);
  --warn: #C93400;
  --warn-tint: rgba(255, 159, 10, 0.2);
  --key: #FFFFFF;
  --key-alt: #E5E5EA;
  --key-press: #D1D1D6;
  --key-shadow: 0 1px 0 rgba(0, 0, 0, 0.13);
  --seg-bg: rgba(118, 118, 128, 0.12);
  --seg-thumb: #FFFFFF;
  --seg-shadow: 0 2px 6px rgba(0, 0, 0, 0.1), 0 0 0 0.5px rgba(0, 0, 0, 0.05);
  --switch-off: rgba(120, 120, 128, 0.16);
  --switch-on: #34C759;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #000000;
    --surface: #1C1C1E;
    --ink: #F5F5F7;
    --ink-2: #A1A1A6;
    --ink-3: #636366;
    --hair: rgba(84, 84, 88, 0.6);
    --accent: #0A84FF;
    --accent-ink: #FFFFFF;
    --accent-tint: rgba(10, 132, 255, 0.2);
    --good: #30D158;
    --good-tint: rgba(48, 209, 88, 0.2);
    --bad: #FF453A;
    --bad-tint: rgba(255, 69, 58, 0.2);
    --warn: #FF9F0A;
    --warn-tint: rgba(255, 159, 10, 0.22);
    --key: #2C2C2E;
    --key-alt: #1C1C1E;
    --key-press: #48484A;
    --key-shadow: 0 1px 0 rgba(0, 0, 0, 0.7);
    --seg-bg: rgba(118, 118, 128, 0.24);
    --seg-thumb: #636366;
    --seg-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    --switch-off: rgba(120, 120, 128, 0.32);
    --switch-on: #30D158;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #000000;
  --surface: #1C1C1E;
  --ink: #F5F5F7;
  --ink-2: #A1A1A6;
  --ink-3: #636366;
  --hair: rgba(84, 84, 88, 0.6);
  --accent: #0A84FF;
  --accent-ink: #FFFFFF;
  --accent-tint: rgba(10, 132, 255, 0.2);
  --good: #30D158;
  --good-tint: rgba(48, 209, 88, 0.2);
  --bad: #FF453A;
  --bad-tint: rgba(255, 69, 58, 0.2);
  --warn: #FF9F0A;
  --warn-tint: rgba(255, 159, 10, 0.22);
  --key: #2C2C2E;
  --key-alt: #1C1C1E;
  --key-press: #48484A;
  --key-shadow: 0 1px 0 rgba(0, 0, 0, 0.7);
  --seg-bg: rgba(118, 118, 128, 0.24);
  --seg-thumb: #636366;
  --seg-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  --switch-off: rgba(120, 120, 128, 0.32);
  --switch-on: #30D158;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font: 400 15px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }

.app {
  max-width: 520px;
  margin: 0 auto;
  padding: 14px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
}

/* Header */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.022em;
}

/* Segmented control */
.seg {
  display: inline-flex;
  background: var(--seg-bg);
  border-radius: 9px;
  padding: 2px;
  gap: 2px;
}
.seg button {
  font-size: 13px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 7px;
  color: var(--ink);
  white-space: nowrap;
  transition: background-color 0.15s;
}
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] {
  background: var(--seg-thumb);
  box-shadow: var(--seg-shadow);
}
.seg.wide { display: flex; }
.seg.wide button { flex: 1; padding: 7px 8px; }

/* Pass progress */
.pass { margin-bottom: 12px; }
.ticks { display: flex; gap: 3px; }
.ticks span {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--hair);
}
.ticks span.on { background: var(--accent); }
.pass-row {
  display: flex;
  justify-content: space-between;
  margin-top: 7px;
  font-size: 13px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

/* Question card */
.qcard {
  background: var(--surface);
  border-radius: 20px;
  padding: 16px 16px 20px;
  text-align: center;
  min-height: 196px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.q-drill { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.q-key { font-size: 17px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; }
.q-hero {
  font-family: var(--font-round);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 12px 0 8px;
  overflow-wrap: anywhere;
}
.hero-xl { font-size: clamp(64px, 20vw, 88px); }
.hero-l { font-size: clamp(52px, 15vw, 72px); }
.hero-m { font-size: clamp(40px, 12vw, 56px); }
.hero-words { font-size: clamp(34px, 10vw, 44px); }
.hero-seq, .hero-pair {
  font-size: clamp(32px, 9.5vw, 46px);
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px 0.6em;
}
.hero-pair .arrow { color: var(--ink-3); font-weight: 400; }
.q-sub { font-size: 15px; color: var(--ink-2); }

/* Answer slots */
.slots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
}
.slot {
  flex: 0 1 78px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.slot-label { font-family: var(--font-round); font-size: 12px; font-weight: 600; color: var(--ink-2); height: 15px; }
.slot-box {
  width: 100%;
  height: 48px;
  border-radius: 12px;
  background: var(--surface);
  border: 1.5px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-round);
  font-size: 18px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
}
.slot.active .slot-box { border-color: var(--accent); }
.slot.pending .slot-box::after { content: "…"; color: var(--ink-3); margin-left: 1px; }
/* Five and six note chords: more slots, narrower boxes */
.slots.many { gap: 5px; }
.slots.many .slot { flex: 0 1 56px; }
.slots.many .slot-box { height: 44px; font-size: 16px; }
.slots.nudge { animation: nudge 0.3s; }
@keyframes nudge {
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* Keypads */
.pad { margin-top: 14px; }
.notes-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.key {
  height: 46px;
  border-radius: 10px;
  background: var(--key);
  box-shadow: var(--key-shadow);
  font-size: 17px;
  font-weight: 500;
  min-width: 0;
}
.key.alt { background: var(--key-alt); font-size: 16px; }
.key:active { background: var(--key-press); }
.key.on { background: var(--accent); color: var(--accent-ink); }
.quality-row {
  display: grid;
  gap: 6px;
  margin-top: 10px;
}
.qual {
  height: 44px;
  border-radius: 22px;
  background: var(--accent-tint);
  color: var(--accent);
  font-size: 16px;
  font-weight: 600;
}
.qual:active { background: var(--accent); color: var(--accent-ink); }
.deg-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.deg-key {
  height: 58px;
  border-radius: 12px;
  background: var(--key);
  box-shadow: var(--key-shadow);
  font-family: var(--font-round);
  font-size: 21px;
  font-weight: 600;
  min-width: 0;
}
.deg-key:active { background: var(--key-press); }
.iv-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}
.iv-key {
  height: 50px;
  border-radius: 10px;
  background: var(--key);
  box-shadow: var(--key-shadow);
  font-family: var(--font-round);
  font-size: 17px;
  font-weight: 600;
}
.iv-key:active { background: var(--key-press); }

/* Actions */
.actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  min-height: 44px;
}
.actions .spacer { flex: 1; }
.btn {
  height: 44px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  padding: 0 18px;
}
.btn.text { color: var(--accent); font-weight: 500; padding: 0 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { opacity: 0.35; }
.btn.block { width: 100%; height: 50px; }
.btn.danger { color: var(--bad); font-weight: 500; }

/* Feedback */
.feedback {
  margin-top: 12px;
  background: var(--surface);
  border-radius: 20px;
  padding: 16px 16px 16px;
  animation: rise 0.18s ease-out;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.fb-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}
.fb-verdict { font-size: 20px; font-weight: 700; letter-spacing: -0.015em; }
.fb-verdict.ok { color: var(--good); }
.fb-verdict.bad { color: var(--bad); }
.fb-verdict.warn { color: var(--warn); }
.fb-verdict.muted { color: var(--ink-2); }
.fb-time { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fb-rows { margin-top: 10px; display: grid; gap: 6px; }
.fb-row { display: flex; align-items: center; gap: 10px; }
.fb-row-label { width: 54px; flex: none; font-size: 13px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-round);
  font-weight: 600;
  font-size: 16px;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--canvas);
}
.chip.good { background: var(--good-tint); }
.chip.miss { background: var(--bad-tint); color: var(--bad); }
.fb-explain { margin-top: 12px; font-size: 15px; line-height: 1.5; }
.fb-explain b { font-weight: 650; }

/* Key strip */
.strip { margin-top: 14px; }
.strip-title { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.strip-row {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}
.cell {
  background: var(--canvas);
  border-radius: 10px;
  padding: 7px 1px 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.cell .deg { font-family: var(--font-round); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.cell .nm { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.strip.split .cell .nm { display: flex; flex-direction: column; line-height: 1.12; }
.strip.split .cell .nm b { font-size: 13px; font-weight: 600; }
.strip.split .cell .nm i { font-size: 10px; font-weight: 600; font-style: normal; letter-spacing: -0.02em; }
.cell.off .nm { color: var(--ink-3); }
.cell.hi { background: var(--accent); color: var(--accent-ink); }
.cell.hi .deg { color: var(--accent-ink); opacity: 0.8; }
.cell.from { box-shadow: inset 0 0 0 1.5px var(--accent); }
.fb-next { margin-top: 16px; }

/* Grouped lists (settings, progress) */
.group { margin-top: 22px; }
.group:first-child { margin-top: 4px; }
.group-title { font-size: 13px; color: var(--ink-2); padding: 0 4px 7px; }
.group-note { font-size: 13px; color: var(--ink-2); padding: 7px 4px 0; }
.list { background: var(--surface); border-radius: 14px; overflow: hidden; }
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  min-height: 48px;
  position: relative;
}
.row + .row::before {
  content: "";
  position: absolute;
  top: 0;
  left: 14px;
  right: 0;
  border-top: 0.5px solid var(--hair);
}
.row-main { flex: 1; min-width: 0; }
.row-label { font-size: 16px; }
.row-sub { font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.row-value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.subhead {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  padding: 10px 14px 4px;
  background: var(--surface);
}

/* Switch */
.switch {
  flex: none;
  width: 51px;
  height: 31px;
  border-radius: 16px;
  background: var(--switch-off);
  position: relative;
  transition: background-color 0.2s;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
  transition: transform 0.2s;
}
.switch[aria-checked="true"] { background: var(--switch-on); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* Progress */
.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--surface);
  border-radius: 14px;
  padding: 14px 6px;
  text-align: center;
}
.summary div + div { border-left: 0.5px solid var(--hair); }
.sum-num { font-family: var(--font-round); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.sum-label { font-size: 12px; color: var(--ink-2); }
.heat {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
}
.hcell {
  border-radius: 12px;
  padding: 8px 2px 9px;
  text-align: center;
  background: var(--surface);
  min-width: 0;
}
.hcell .hk { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.hcell .hk.small { font-size: 12px; letter-spacing: -0.02em; }
.hcell .hp { font-family: var(--font-round); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 1px; }
.hcell .hn { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hcell.none .hp { color: var(--ink-3); }
.hcell.low { background: var(--bad-tint); }
.hcell.mid { background: var(--warn-tint); }
.hcell.high { background: var(--good-tint); }
.hcell.thin { opacity: 0.72; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); padding: 8px 4px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .l-low { background: var(--bad-tint); box-shadow: inset 0 0 0 1px var(--bad); }
.legend .l-mid { background: var(--warn-tint); box-shadow: inset 0 0 0 1px var(--warn); }
.legend .l-high { background: var(--good-tint); box-shadow: inset 0 0 0 1px var(--good); }
.empty-note { font-size: 15px; color: var(--ink-2); padding: 18px 4px 0; }

@media (max-width: 360px) {
  .key { font-size: 15px; height: 44px; }
  .key.alt { font-size: 14px; }
  .deg-key { font-size: 18px; }
  .iv-key { font-size: 15px; }
  .seg button { padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Added: choices, fretboard, sound, explore ---------- */
.q-cap {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  margin-top: 2px;
  letter-spacing: 0.01em;
}
.hero-seq .capped {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.05;
}
.hero-seq .capped b { font-weight: 700; }
.hero-seq .capped i {
  font-style: normal;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
  margin-top: 4px;
  letter-spacing: 0.01em;
}

.choice-grid { display: grid; gap: 6px; }
.ch-key {
  height: 52px;
  border: 0;
  border-radius: 10px;
  background: var(--key);
  box-shadow: var(--key-shadow);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
}
.ch-key:active { background: var(--accent); color: var(--accent-ink); }

/* Fretboard */
.hero-fret { display: block; width: 100%; }
.fb { width: 100%; }
.fb-grid {
  display: grid;
  align-items: stretch;
  gap: 0;
  max-width: 420px;
  margin: 0 auto;
}
.fb-open {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 7px;
  height: 26px;
  border-right: 3px solid var(--ink-3);
}
.fb-grid.nut .fb-open { border-right-width: 5px; border-right-color: var(--ink); }
.fb-name { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.fb-open.on .fb-name {
  color: var(--accent-ink);
  background: var(--accent);
  border-radius: 999px;
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
}
.fb-cell {
  position: relative;
  height: 26px;
  border-right: 1px solid var(--hair);
}
.fb-cell::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  background: var(--ink-3);
}
.fb-cell.fb-first::before, .fb-cell.fb-last::before { background: var(--ink-2); }
.fb-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}
.fb-num { font-size: 11px; color: var(--ink-3); text-align: center; padding-top: 4px; }
.fb-num.mark { color: var(--ink-2); font-weight: 600; }
.fb-cap { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--ink); }

/* Sound */
.btn.hear {
  margin-left: auto;
  margin-right: 10px;
  white-space: nowrap;
  flex: none;
  align-self: flex-start;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--accent-tint);
  color: var(--accent);
  font-weight: 500;
  font-size: 13px;
}

/* Settings extras */
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.preset {
  border: 0;
  border-radius: 999px;
  background: var(--seg-bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 500;
  padding: 8px 14px;
  cursor: pointer;
}
.preset:active { background: var(--accent); color: var(--accent-ink); }
.backup { margin-top: 10px; }
.backup summary { font-size: 14px; color: var(--accent); cursor: pointer; padding: 6px 0; }
.backup-box {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--hair);
  border-radius: 10px;
  background: var(--canvas);
  color: var(--ink-2);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  padding: 8px;
  resize: vertical;
}
.backup-row { display: flex; gap: 8px; margin-top: 8px; }

/* Explore */
.keypick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
.kchip {
  height: 40px;
  border: 0;
  border-radius: 10px;
  background: var(--key);
  box-shadow: var(--key-shadow);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.kchip.small { font-size: 12px; }
.kchip.on { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.ex-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ex-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.facts { display: grid; gap: 7px; margin-top: 10px; }
.fact { display: flex; gap: 10px; align-items: baseline; }
.fact-k { width: 92px; flex: none; font-size: 13px; color: var(--ink-2); }
.fact-v { font-size: 15px; font-weight: 500; }
.ex-scale { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
.ex-note {
  display: grid;
  gap: 2px;
  padding: 7px 2px;
  border: 0;
  border-radius: 10px;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font);
  cursor: pointer;
}
.ex-note .deg { font-family: var(--font-round); font-size: 11px; color: var(--ink-2); }
.ex-note .nm { font-size: 15px; font-weight: 600; }
.ex-note:active { background: var(--accent-tint); }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
.ex-table { border-collapse: collapse; font-size: 13px; width: max-content; min-width: 100%; }
.ex-table th, .ex-table td { padding: 6px 7px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--hair); }
.ex-table thead th { font-size: 11px; font-weight: 500; color: var(--ink-2); text-transform: lowercase; }
.ex-table th.stick {
  position: sticky;
  left: 0;
  background: var(--surface);
  font-family: var(--font-round);
  font-weight: 600;
  z-index: 1;
}
.ex-table td.note { font-weight: 600; }
.ex-table td.off { color: var(--ink-3); }
.ex-table td.job { color: var(--ink-2); font-size: 12px; }
.cellbtn {
  border: 0;
  background: none;
  padding: 2px 0;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
}
.cellbtn:active { color: var(--accent); }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.bigchip {
  display: grid;
  gap: 2px;
  justify-items: flex-start;
  text-align: left;
  border: 0;
  border-radius: 12px;
  background: var(--canvas);
  padding: 8px 12px;
  color: var(--ink);
  font-family: var(--font);
  cursor: pointer;
}
.bigchip.wide { flex: 1 1 100%; }
.bigchip b { font-size: 15px; font-weight: 650; }
.bigchip i { font-style: normal; font-size: 12px; color: var(--ink-2); }
.bigchip:active { background: var(--accent-tint); }
@media (max-width: 360px) {
  .seg button { font-size: 13px; padding: 6px 4px; }
}

/* Playable answers and strip cells */
button.chip.playable, button.cell.tappable {
  border: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  -webkit-appearance: none;
}
button.cell.tappable { width: 100%; }
button.chip.playable::after {
  content: " ♪";
  font-size: 0.75em;
  opacity: 0.55;
}
button.chip.playable:active, button.cell.tappable:active { filter: brightness(0.92); }
.fb-gap {
  font-size: 13px;
  color: var(--ink-2);
  margin-top: 8px;
}

/* Fretboard: a second dot for the answer, and a lit string for a question
   about one string that has no dot on it yet. */
.fb-dot.from { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
.fb-dot.to { background: var(--accent); }
.fb-cell.lit, .fb-open.lit { background: color-mix(in srgb, var(--accent) 11%, transparent); }
.fb-dot { display: grid; place-items: center; font-size: 10px; font-weight: 700; }

/* Drill groups: folded by default so the list is a page, not a scroll. */
.drill-list { display: grid; gap: 0; }
.drill-group { border-bottom: 1px solid var(--hair); }
.drill-group:last-child { border-bottom: 0; }
.drill-group > summary {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 13px 2px; cursor: pointer; list-style: none; font-weight: 600;
}
.drill-group > summary::-webkit-details-marker { display: none; }
.drill-group > summary::after {
  content: "›"; font-size: 19px; color: var(--ink-3); transform: rotate(90deg);
  transition: transform 0.15s;
}
.drill-group[open] > summary::after { transform: rotate(-90deg); }
.dg-name { flex: 1; }
.dg-count { font-size: 13px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.drill-group.none-on .dg-count { color: var(--ink-3); }
.dg-body { padding-bottom: 6px; }
.dg-all { display: flex; gap: 14px; padding: 2px 2px 8px; }

/* The neck map: twelve frets across a phone, so the dots carry their degree
   rather than relying on a legend. */
.neck-tabs { margin-bottom: 10px; }
.neck-box { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.neck-box .fb-grid { min-width: 330px; }
.neck-box .fb-dot { width: 17px; height: 17px; margin: -8.5px 0 0 -8.5px; font-size: 9px; }
.neck-box .fb-num { font-size: 10px; }
.modes-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.modes-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-2);
  padding: 4px 8px 6px 0; text-transform: uppercase; letter-spacing: 0.04em; }
.modes-table td { padding: 7px 8px 7px 0; border-top: 1px solid var(--hair); white-space: nowrap; }
.mt-name { font-weight: 650; }
.mt-degs { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mt-tell { font-weight: 650; color: var(--accent); }
.table-wrap { overflow-x: auto; }
.fb-odeg {
  margin-left: 4px; width: 17px; height: 17px; border-radius: 999px;
  display: grid; place-items: center; font-size: 9px; font-weight: 700;
  border: 2px solid var(--accent); color: var(--accent); background: transparent;
}
.fb-odeg.to { background: var(--accent); color: var(--accent-ink); }
.neck-box .fb-grid { grid-template-columns: 3.6em repeat(12, 1fr) !important; min-width: 360px; }
.row-value.weak { color: var(--bad); font-weight: 650; }

/* The CAGED chain: five cards in neck order, so the sequence reads left to
   right the way the hand travels. */
.caged-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.caged-card {
  flex: 1 0 auto; min-width: 62px; display: grid; justify-items: center; gap: 1px;
  background: var(--surface); border-radius: 12px; padding: 10px 8px;
}
.caged-card.open { background: color-mix(in srgb, var(--accent) 13%, var(--surface)); }
.cc-shape { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
.cc-hand { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.cc-root { font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- Difficulty ---------- */
.start { padding: 4px 0 8px; }
.start-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 6px 2px 2px; }
.start-sub { font-size: 14px; color: var(--ink-2); margin: 0 2px 14px; }
.start-note { font-size: 13px; color: var(--ink-2); line-height: 1.45; margin: 14px 2px 0; }
.levels { display: grid; gap: 10px; }
.level-btn {
  display: grid; gap: 3px; text-align: left; width: 100%;
  background: var(--surface); border-radius: 14px; padding: 14px 16px;
  border: 2px solid transparent; box-shadow: var(--key-shadow, none);
}
.level-btn.on { border-color: var(--accent); }
.lv-name { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.lv-sub { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.level-btn.lv-easy .lv-name { color: var(--good); }
.level-btn.lv-hard .lv-name { color: var(--warn); }
.level-btn.lv-god .lv-name { color: var(--bad); }
.level-chip {
  font-size: 12px; font-weight: 650; padding: 3px 10px; border-radius: 999px;
  background: var(--seg-bg); color: var(--ink);
}
.level-chip.lv-easy { color: var(--good); }
.level-chip.lv-hard { color: var(--warn); }
.level-chip.lv-god { color: var(--bad); }
.q-help { margin: 8px 0 0; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2); }
.q-clock { height: 4px; border-radius: 2px; background: var(--hair); margin-top: 12px; overflow: hidden; }
.q-clock i { display: block; height: 100%; background: var(--accent); transform-origin: left; }
.q-clock.low i { background: var(--bad); }

/* Custom difficulty: the dials sit under the Custom card on the start screen
   and under Difficulty in Settings — one editor, two places. */
.custom-ed { background: var(--surface); border-radius: 14px; padding: 6px 14px 14px; display: grid; gap: 4px; }
.ce-label { font-size: 12px; font-weight: 650; color: var(--ink-2); margin: 10px 0 2px; }
.ce-seg button { padding: 7px 2px; font-size: 12.5px; }
.ce-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ce-chip { font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: var(--seg-bg); color: var(--ink-2); }
.ce-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ce-start { margin-top: 12px; }
.level-btn.lv-custom .lv-name { color: var(--accent); }
.level-chip.lv-custom { color: var(--accent); }
#customSettings { margin-top: 12px; padding: 0 2px; background: transparent; }

/* Typed answers — what used to be a row of options is now a box to write in. */
.type-row { display: flex; gap: 8px; }
.type-in {
  flex: 1; min-width: 0; height: 52px; padding: 0 14px; border-radius: 12px;
  border: 1.5px solid var(--hair); background: var(--surface); color: var(--ink);
  font: inherit; font-family: var(--font-round); font-size: 18px; font-weight: 600;
  -webkit-appearance: none; appearance: none;
}
.type-in:focus { outline: none; border-color: var(--accent); }
.type-in::placeholder { color: var(--ink-3); font-weight: 500; font-family: var(--font); font-size: 16px; }
.type-go { height: 52px; flex: none; }
.type-hint { font-size: 12.5px; color: var(--ink-2); margin: 7px 2px 0; line-height: 1.4; }
.type-row.nudge { animation: nudge 0.3s; }

/* Working — a scratch box under every question. Read-only once answered,
   because the checker reviews what was written at the time of answering. */
.notes { margin-top: 14px; }
.notes-label { display: block; font-size: 13px; color: var(--ink-2); padding: 0 4px 6px; }
.notes textarea {
  display: block; width: 100%; min-height: 64px; max-height: 260px; resize: none; overflow-y: auto;
  padding: 10px 12px; border-radius: 12px; border: 1.5px solid transparent;
  background: var(--surface); color: var(--ink);
  font: inherit; font-size: 15px; line-height: 1.45;
}
.notes textarea:focus { outline: none; border-color: var(--accent); }
.notes textarea::placeholder { color: var(--ink-3); }
.notes textarea[readonly] { background: transparent; border-color: var(--hair); color: var(--ink-2); }

/* The checker — its own card under the answer, so the answer and the Next
   button never move while it writes. */
.review {
  margin-top: 12px; background: var(--surface); border-radius: 20px; padding: 16px;
  animation: rise 0.18s ease-out;
}
.rv-head { display: flex; align-items: center; gap: 10px; }
.rv-title { flex: 1; font-size: 13px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
.rv-stop, .rv-retry { font-size: 14px; font-weight: 550; color: var(--accent); padding: 4px 2px; }
.rv-wait { display: flex; align-items: center; gap: 9px; margin-top: 12px; font-size: 15px; color: var(--ink-2); }
.rv-dots { display: inline-flex; gap: 4px; }
.rv-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: rvDot 1.2s infinite ease-in-out; }
.rv-dots i:nth-child(2) { animation-delay: 0.15s; }
.rv-dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes rvDot { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
.rv-close { margin-top: 12px; }
.rv-close-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-2); }
.rv-close-row b { font-family: var(--font-round); font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
.rv-bar { height: 6px; border-radius: 999px; background: var(--hair); overflow: hidden; margin-top: 6px; }
.rv-bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.4s ease-out; }
.rv-bar.lo i { background: var(--bad); }
.rv-bar.mid i { background: var(--warn); }
.rv-bar.hi i { background: var(--good); }
.rv-body { margin-top: 4px; }
.rv-sec { margin-top: 14px; }
.rv-sec h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.rv-sec p { margin: 0 0 6px; font-size: 15px; line-height: 1.5; }
.rv-sec ul, .rv-sec ol { margin: 2px 0 6px; padding-left: 20px; }
.rv-sec li { font-size: 15px; line-height: 1.5; margin: 2px 0; }
.rv-sec.flag { background: var(--warn-tint); border-radius: 12px; padding: 10px 12px; }
.rv-note { margin-top: 10px; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.rv-err { margin-top: 10px; font-size: 14px; color: var(--ink-2); line-height: 1.45; }
.fb-working { margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.fb-grade { font-size: 13px; color: var(--ink-2); margin-top: 6px; line-height: 1.45; }

/* Vocal mode */
.qcard { position: relative; }
.q-say {
  position: absolute; top: 12px; right: 12px; padding: 5px 11px; border-radius: 999px;
  background: var(--accent-tint); color: var(--accent); font-size: 12.5px; font-weight: 600;
}
.q-say:active { background: var(--accent); color: var(--accent-ink); }
.voice-bar { margin-top: 12px; }
.hold-btn {
  width: 100%; min-height: 64px; border-radius: 16px; display: grid; gap: 1px; place-items: center;
  background: var(--accent); color: var(--accent-ink); padding: 10px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
}
.hold-btn .hold-main { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
.hold-btn .hold-sub { font-size: 12px; opacity: 0.8; }
.hold-btn.on { background: var(--bad); animation: holdPulse 1.1s ease-in-out infinite; }
.hold-btn:disabled { opacity: 0.4; }
@keyframes holdPulse { 0%, 100% { filter: none; } 50% { filter: brightness(1.12); } }
.heard { min-height: 18px; margin: 8px 2px 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.voice-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.voice-pick {
  flex: 1; min-width: 0; height: 40px; border-radius: 10px; border: 1px solid var(--hair);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; padding: 0 10px;
}
.key-box { margin-top: 10px; }
.key-row { display: flex; gap: 8px; }
.key-in { height: 44px; font-size: 15px; font-family: var(--font); }
.rv-ans { margin-top: 4px; }
.rv-ans summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 550; }
.rv-ans p { margin-top: 6px; }
@media (prefers-reduced-motion: reduce) { .hold-btn.on { animation: none; } }

.qcard.has-say { padding-top: 48px; }

/* Swap between tapping an option and typing the answer, on the question itself. */
.ans-switch { display: block; margin: 9px auto 0; padding: 4px 8px; font-size: 14px; font-weight: 550; color: var(--accent); }

/* The Gemini voice: describe her, make her, hear her. */
.gem-voice { margin-top: 12px; }
.gem-prompt {
  display: block; width: 100%; resize: vertical; min-height: 76px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--hair); background: var(--surface); color: var(--ink); font: inherit; font-size: 14.5px; line-height: 1.45;
}
.gem-prompt:focus { outline: none; border-color: var(--accent); }
.gem-btns { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
.gem-btns .btn.primary { height: 40px; font-size: 15px; }
.gem-btns .btn.primary:disabled { opacity: 0.4; }
#voiceEngine { margin-top: 12px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="title">Gooby Goober</h1>
    <div class="seg" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-quiz" aria-controls="view-quiz" aria-selected="true">Quiz</button>
      <button type="button" role="tab" id="tab-explore" aria-controls="view-explore" aria-selected="false">Explore</button>
      <button type="button" role="tab" id="tab-progress" aria-controls="view-progress" aria-selected="false">Stats</button>
      <button type="button" role="tab" id="tab-settings" aria-controls="view-settings" aria-selected="false">Settings</button>
    </div>
  </header>

  <main>
    <section id="view-quiz" role="tabpanel" aria-labelledby="tab-quiz">
      <div id="startPanel" class="start" hidden>
        <p class="start-title">Pick a difficulty</p>
        <p class="start-sub" id="startSub"></p>
        <div class="levels" id="levels"></div>
        <p class="start-note">Your drills stay as they are. Difficulty only changes how hard each one gets.
          Change drills in Settings.</p>
      </div>
      <div id="quizBody">
      <div class="pass">
        <div class="ticks" id="ticks" aria-hidden="true"></div>
        <div class="pass-row">
          <span id="passText"></span>
          <button type="button" class="level-chip" id="levelChip" aria-label="Change difficulty"></button>
          <span id="streakText"></span>
        </div>
      </div>

      <div class="qcard" aria-live="polite">
        <button type="button" class="q-say" id="qSay" hidden aria-label="Read the question again">Say again</button>
        <p class="q-drill" id="qDrill"></p>
        <p class="q-key" id="qKey"></p>
        <div class="q-hero" id="qHero"></div>
        <p class="q-cap" id="qCap" hidden></p>
        <p class="q-sub" id="qSub"></p>
        <p class="q-help" id="qHelp" hidden></p>
        <div class="q-clock" id="qClock" hidden><i id="qClockFill"></i></div>
      </div>

      <div id="inputArea">
        <div class="slots" id="slots" hidden></div>
        <div class="pad" id="pad"></div>
        <div class="actions" id="actions"></div>
        <div class="voice-bar" id="voiceBar" hidden>
          <button type="button" class="hold-btn" id="holdBtn">
            <span class="hold-main">Hold to answer</span>
            <span class="hold-sub">Let go to submit</span>
          </button>
          <p class="heard" id="heard" aria-live="polite"></p>
        </div>
      </div>

      <!-- Working for this question. The checker reads it with the answer. -->
      <div class="notes" id="notesBox">
        <label class="notes-label" for="qNotes" id="notesLabel">Working</label>
        <textarea id="qNotes" rows="2" spellcheck="false" autocomplete="off"
          placeholder="Jot your working here — the checker reads it"></textarea>
      </div>

      <div class="feedback" id="feedback" aria-live="polite" hidden></div>
      <div class="review" id="review" hidden></div>
      </div>
    </section>

    <section id="view-explore" role="tabpanel" aria-labelledby="tab-explore" hidden></section>
    <section id="view-progress" role="tabpanel" aria-labelledby="tab-progress" hidden></section>
    <section id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
  </main>
</div>
<script>
/* ===== Theory engine: spelling-correct notes, scales, chords, intervals ===== */
const Theory = (() => {
  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const NAT = [0, 2, 4, 5, 7, 9, 11];
  const ACC = { '-2': '𝄫', '-1': '♭', '0': '', '1': '♯', '2': '𝄪' };
  const mod = (n, m) => ((n % m) + m) % m;

  const pc = n => mod(NAT[n.l] + n.a, 12);
  const name = n => LETTERS[n.l] + ACC[n.a];
  const spell = (l, p) => {
    let a = mod(p - NAT[l], 12);
    if (a > 6) a -= 12;
    return { l, a };
  };
  const parse = s => {
    const l = LETTERS.indexOf(s[0]);
    const r = s.slice(1);
    const a = r === '♯' ? 1 : r === '♭' ? -1 : r === '𝄪' ? 2 : r === '𝄫' ? -2 : 0;
    return { l, a };
  };

  const MODES = {
    major: {
      steps: [0, 2, 4, 5, 7, 9, 11],
      labels: ['1', '2', '3', '4', '5', '6', '7'],
      fromTonic: ['P1', 'M2', 'M3', 'P4', 'P5', 'M6', 'M7'],
    },
    minor: {
      steps: [0, 2, 3, 5, 7, 8, 10],
      labels: ['1', '2', '♭3', '4', '5', '♭6', '♭7'],
      fromTonic: ['P1', 'M2', 'm3', 'P4', 'P5', 'm6', 'm7'],

/* ===== Question generators ===== */
const Quiz = (() => {
  const T = Theory;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => {
    for (let i = a.length - 1; i > 0; i--) {

      [a[i], a[j]] = [a[j], a[i]];

  // pass never starts with the item that ended the previous one.
  class Bag {
    constructor(items) {

        this.drawn = 0;
      }
      this.drawn++;
      this.last = this.pool.pop();
      return this.last;
    }
    // Hand back a draw that was never used (a question thrown away unanswered),
    // so the current pass still covers every item exactly once.
    putBack(item) {
      if (!this.items.includes(item) || this.drawn < 1) return false;
      this.pool.splice(Math.floor(Math.random() * (this.pool.length + 1)), 0, item);
      this.drawn--;

  const DRILLS = [

    { id: '7th', name: '7th chords', eg: 'Cmaj7, Dm7, G7', types: ['7th'] },
    { id: '6th', name: '6th chords', eg: 'C6, Dm6, G6', types: ['6th'] },
    { id: '9th', name: '9th chords', eg: 'Cmaj9, Dm9, G9', types: ['9th'] },

  const TYPE_IDS = TYPE_SETTINGS.map(t => t.id);

      [0, 5, 1, 4], [2, 5, 1, 4], [3, 0, 4, 5], [5, 4, 3, 2], [3, 2, 1, 0], [0, 2, 3, 4]],
    minor: [[0, 6, 5, 6], [0, 5, 2, 6], [0, 3, 6, 2], [0, 6, 5, 4], [5, 6, 0], [0, 2, 6, 3], [3, 6, 2, 5],

  };
  const DIM_DEG = { major: 6, minor: 1 };

  const MOTIONS = [

    { label: 'Up a 5th', steps: 4 }, { label: 'Down a 2nd', steps: -1 }, { label: 'Down a 3rd', steps: -2 },
    { label: 'Down a 4th', steps: -3 }, { label: 'Down a 5th', steps: -4 },

  /* Build a set of options that is guaranteed to contain the answer.

  /* ---------- Difficulty ----------

    return shuffle(keep.concat(shuffle(rest).slice(0, Math.max(0, n - keep.length))));
  };

  const b = s => '<b>' + s + '</b>';
  const lab = (key, d) => T.degLabel(key.mode, d);
  const other = mode => (mode === 'major' ? 'minor' : 'major');
  const aOrAn = word => (/^[aeiou]/i.test(word) ? 'an ' : 'a ') + word;

  const gens = {
    deg2note(ctx) {
      const key = ctx.nextKey(), d = ctx.nextDegNT(), sc = T.scale(key), ans = T.name(sc[d]);
      return {
        key, context: T.keyName(key), hero: lab(key, d), sub: 'Which note?',
        input: 'note', slots: 1, answer: [ans],
        explain: `The ${lab(key, d)} is ${fromTonicPhrase(key, d)}: ${b(ans)}.`,
        strip: { key, show: 'notes', hi: [d] },
      };
    },

    note2deg(ctx) {
      const key = ctx.nextKey(), d = ctx.nextDegNT(), sc = T.scale(key), n = T.name(sc[d]);
      return {
        key, context: T.keyName(key), hero: n, sub: 'Which degree?',
        input: 'degree', degreeMode: key.mode, slots: 1, answer: [lab(key, d)],
        explain: d === 0

    interval(ctx) {

      let iv, dir, target;

        iv = LEVEL === 0 ? pick(T.INTERVALS.filter(i => !i.pad && i.semis <= 7))

        dir = !naming && Math.random() < at(0, 0.3, 0.3, 0.5) ? -1 : 1;

          : `${cap(key.mode)} keys run ${T.patternOf(key.mode, type)}. The ${lab(key, d)} is ${T.name(ch.root)}, so it's ${b(ch.name)}.`,
        strip: { key, show: 'chords', hi: [d] },
      };
    },

    chord2deg(ctx) {
      const type = ctx.nextType(), key = ctx.nextKey();
      const d = ctx.nextDegNT(T.degreesWith(key, type)), ch = T.chordAt(key, d, type);
      return {
        key, type, context: T.keyName(key), hero: ch.name, sub: 'Which degree?',
        heroCap: type === 'triad' ? CHORD_CAP[ch.quality] + ' chord' : null,
        input: 'degree', degreeMode: key.mode, slots: 1, answer: [lab(key, d)],
        explain: ch.name === T.name(ch.root)
          ? `${ch.name} sits ${fromTonicPhrase(key, d)}: the ${b(lab(key, d))}.`
          : `${ch.name} is built on ${T.name(ch.root)}, ${fromTonicPhrase(key, d)}: the ${b(lab(key, d))}.`,

    },

    spell(ctx) {

      const d = ctx.nextDeg(T.degreesWith(key, type)), ch = T.chordAt(key, d, type);
      const notes = ch.notes.map(T.name);
      const formula = T.FORMULA[ch.quality].map((f, i) => `${notes[i]} (${f})`).join(', ');
      const byName = Math.random() < 0.5;
      const how = susType(type)
        ? `A ${type} keeps the 5 and swaps the 3 for the ${type === 'sus2' ? '2' : '4'}: ${b(notes.join(' '))}.`
        : `Stack every other note of the key from ${notes[0]}: ${b(notes.join(' '))}.`;

        for (let tries = 0; tries < 40; tries++) {

        input: 'note', slots: 1, answer: [T.name(key.tonic)], answerSuffix: key.mode === 'minor' ? ' minor' : ' major',
        explain: `In ${T.keyName(key)}, ${listJoin(parts)}. No other ${key.mode} key holds ${howMany}.`,

    relative(ctx) {

      if (Math.random() < 0.6) {

          : `A relative major starts on its minor key's ♭3. In ${T.keyName(key)} the ♭3 is ${b(T.name(relTonic))}.`;
        return {
          key, context: '', hero: T.keyName(key), heroKind: 'words',
          sub: key.mode === 'major' ? 'Its relative minor?' : 'Its relative major?',
          input: 'note', slots: 1, answer: [T.name(relTonic)], answerSuffix: key.mode === 'major' ? ' minor' : ' major',
          explain, strip: { key: rel, show: 'chords', hi: [0] },
        };
