  }

  /* Presets are the answer to "what should I even be practising". Each one is
     a session someone would actually sit down and do, not a category listing:
     On the neck is everything you do with the instrument in your hands, Modes
     and scales is the one that needs a quiet room. */
  const PRESETS = [
    { id: 'core', name: 'Core', drills: ['deg2note', 'note2deg', 'interval', 'keysig', 'deg2chord', 'chord2deg', 'spell', 'findkey', 'relative'] },
    { id: 'neck', name: 'On the neck', drills: ['fret', 'findfret', 'caged', 'cagedstring', 'capo', 'stringiv', 'octave', 'penta', 'relpent'] },
    { id: 'modes', name: 'Modes & scales', drills: ['modeparent', 'modechar', 'modedegs', 'modechord', 'modebright', 'scaleshape', 'relative', 'parallel'] },
    { id: 'song', name: 'Songwriting', drills: ['progression', 'transposer', 'motion', 'keyfromchords', 'chordfunc', 'borrow', 'secdom', 'harmonic', 'suswhich', 'cadence', 'inversion', 'commontone'] },
    { id: 'rhythm', name: 'Rhythm', drills: ['notevalue', 'timesig', 'barfill'] },
    { id: 'solo', name: 'Soloing', drills: ['modechord', 'penta', 'relpent', 'octave', 'findfret', 'noterole', 'chordswith', 'scaleshape'] },
    { id: 'all', name: 'Everything', drills: null },
  ];
  function applyPreset(p) {
    DRILL_IDS.forEach(id => {
      S.settings.drills[id] = p.drills ? p.drills.includes(id) : Q.DRILL[id].def !== false;
    });
    buildDrillBag();
    S.stale = true;
    touched();
    const dn = $('#drillNote');
    if (dn) dn.hidden = true;
    refreshSettings();
  }
  /* Turning a whole group off is allowed right up to the point where nothing
     at all is left on, which would leave the quiz with no question to ask. */
  function setGroup(grp, on) {
    const ids = Q.DRILLS.filter(d => d.group === grp).map(d => d.id);
    if (!on) {
      const others = DRILL_IDS.filter(id => !ids.includes(id) && S.settings.drills[id]);
      if (!others.length) { noteDrill('That would leave no drills on at all.'); return; }
    }
    ids.forEach(id => { S.settings.drills[id] = on; });
    buildDrillBag();
    S.stale = true;
    touched();
    refreshSettings();
  }
  function noteDrill(msg) {
    const dn = $('#drillNote');
    if (!dn) return;
    dn.textContent = msg;
    dn.hidden = false;
  }
  function refreshSettings() {
    document.querySelectorAll('#view-settings .drill-group').forEach(g => {
      const ids = Q.DRILLS.filter(d => d.group === g.dataset.group);
      const on = ids.filter(d => S.settings.drills[d.id]).length;
      const c = g.querySelector('.dg-count');
      if (c) c.textContent = `${on} of ${ids.length}`;
      g.classList.toggle('none-on', on === 0);
    });
    document.querySelectorAll('#view-settings [data-setting]').forEach(b =>
      b.setAttribute('aria-pressed', String(String(S.settings[b.dataset.setting]) === b.dataset.value)));
    document.querySelectorAll('#view-settings .switch').forEach(sw =>
      sw.setAttribute('aria-checked', String(!!sw._get())));
    refreshCustom();
  }
  function touched() {
    S.touched = true;
    scheduleSave();
  }
  function changeSetting(name, val) {
    if (S.settings[name] === val) return;
    S.settings[name] = val;
    if (name === 'voiceEngine') {
      touched();
      refreshSettings();
      refreshVoiceUI();
      return;
    }
    if (name === 'answerStyle') {
      touched();
      refreshSettings();
      if (S.q && !S.answered && S.q.input === 'choice') renderPad();
      return;
    }
    if (name === 'checker') {
      if (val === 'off') stopChecker();
      touched();
      refreshSettings();
      refreshCheckerNote();
      return;
    }
    if (name === 'mode') { buildKeyBag(); buildDrillBag(); }
    if (name === 'focus') buildKeyBag();
    if (name === 'level') { buildKeyBag(); buildTypeBag(); renderLevelChip(); refreshCustom(); }
    S.stale = true;
    touched();
    refreshSettings();
  }
  function setType(id, val) {
    const note = $('#typeNote');
    if (!val && TYPE_IDS.filter(x => S.settings.types[x]).length === 1) {
      note.textContent = 'Keep at least one chord kind on.';
      return;
    }
    note.textContent = '6ths, 9ths, 11ths and 13ths only fit some degrees. The strip under each answer shows which.';
    S.settings.types[id] = val;
    buildTypeBag();
    S.stale = true;
    touched();
    refreshCustom();
  }
  function setDrill(id, val) {
    const note = $('#drillNote');
    if (!val && DRILL_IDS.filter(x => S.settings.drills[x]).length === 1) {
      note.textContent = 'Keep at least one drill on.';
      note.hidden = false;
      return;
    }
    note.hidden = true;
    S.settings.drills[id] = val;
    buildDrillBag();
    S.stale = true;
    touched();
  }

  /* ---------- Views ---------- */
  function showView(v) {
    S.view = v;
    ['quiz', 'explore', 'progress', 'settings'].forEach(x => {
      $('#view-' + x).hidden = x !== v;
      $('#tab-' + x).setAttribute('aria-selected', String(x === v));
    });
    if (v === 'explore') renderExplore();
    if (v === 'progress') renderProgress();
    if (v === 'settings') { refreshSettings(); refreshCheckerNote(); refreshVoiceUI(); }
    if (v !== 'quiz') { stopSpeech(); if (S.listening) { S.listening.abort(); S.listening = null; resetHold(); } }
    if (v === 'quiz' && S.stale) {
      S.stale = false;
      nextQuestion();
    } else if (v === 'quiz') startClock();
  }

  /* ---------- Saved progress (db capability, per-viewer private doc) ---------- */
  function setStatus(s) {
    S.store.status = s;
    const n = $('#storeStatus');
    if (n) n.textContent = STATUS_TEXT[s];
  }
  function sanitizeSettings(d) {
    const s = defaults();
    if (['major', 'minor', 'both'].includes(d.mode)) s.mode = d.mode;
    if (['all', 'weak', 'guitar'].includes(d.focus)) s.focus = d.focus;
    if (LEVEL_IDS.includes(d.level)) s.level = d.level;
    // Each custom dial is kept only if it is one the editor can actually set.
    if (d.custom && typeof d.custom === 'object') {
      Object.keys(CUSTOM_CHOICES).forEach(k => {
        if (CUSTOM_CHOICES[k].some(([v]) => v === d.custom[k])) s.custom[k] = d.custom[k];
      });
    }
    if (typeof d.auto === 'boolean') s.auto = d.auto;
    if (['all', 'wrong', 'off'].includes(d.checker)) s.checker = d.checker;
    if (['options', 'typing'].includes(d.answerStyle)) s.answerStyle = d.answerStyle;
    if (['gemini', 'device'].includes(d.voiceEngine)) s.voiceEngine = d.voiceEngine;
    if (typeof d.holdMic === 'boolean') s.holdMic = d.holdMic;
    if (typeof d.voice === 'boolean') s.voice = d.voice;
    if (typeof d.voiceName === 'string' && d.voiceName.length < 200) s.voiceName = d.voiceName;
    if (d.types && typeof d.types === 'object') {
      TYPE_IDS.forEach(id => {
        if (typeof d.types[id] === 'boolean') s.types[id] = d.types[id];
      });
    } else if (typeof d.sevenths === 'boolean') {
      s.types.triad = !d.sevenths;
      s.types['7th'] = d.sevenths;
    }
    if (!TYPE_IDS.some(id => s.types[id])) s.types = defaults().types;
    if (d.drills && typeof d.drills === 'object') {
      DRILL_IDS.forEach(id => {
        if (typeof d.drills[id] === 'boolean') s.drills[id] = d.drills[id];
      });
    }
    if (!DRILL_IDS.some(id => s.drills[id])) s.drills = defaults().drills;
    return s;
  }
  function mergeLoaded(d) {
    if (!d || typeof d !== 'object') return;
    for (const part of ['keys', 'drills']) {
      const src = d[part];
      if (!src || typeof src !== 'object') continue;
      for (const id of Object.keys(src)) {
        if (part === 'keys' && !/^(major|minor):([0-9]|1[01])$/.test(id)) continue;
        if (part === 'drills' && !Q.DRILL[id]) continue;
        const a = src[id];
        if (!a || typeof a !== 'object') continue;
        const t = S.stats[part][id] || (S.stats[part][id] = blankStat());
        for (const f of ['n', 'c', 't', 'tn']) t[f] += Math.max(0, Number(a[f]) || 0);
      }
    }
    if (d.settings && typeof d.settings === 'object' && !S.touched && S.session.n === 0) {
      S.settings = sanitizeSettings(d.settings);
      buildAllBags();
      refreshSettings();
      renderLevelChip();
      if (S.atStart) renderStart();
      if (S.view === 'quiz') nextQuestion();
      else S.stale = true;
    }
    if (S.view === 'progress') renderProgress();
  }
  /* Outside the Claude app — GitHub Pages, a saved copy — there is no account
     to save to, so progress lives in this browser's storage instead. */
  const LOCAL_KEY = 'gooby.progress.v1';
  function useLocal() {
    let saved = null;
    try {
      localStorage.setItem(LOCAL_KEY + '.probe', '1');
      localStorage.removeItem(LOCAL_KEY + '.probe');
      saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
    } catch (e) { return setStatus('none'); }
    if (saved && typeof saved === 'object') mergeLoaded(saved);
    S.store.ref = { set: async data => { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } };
    setStatus('local');
    if (S.session.n > 0 || S.touched) scheduleSave();
  }
  async function initStore() {
    try {
      const c = window.claude;
      if (!c || typeof c.use !== 'function') return useLocal();
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (!db || !user) return useLocal();
      const uid = await user.id();
      if (!uid) return useLocal();
      const ref = db.doc('data/users/' + uid + '/progress');
      let snap;
      try {
        snap = await ref.get();
      } catch (e) {
        if (e && e.code === 'unavailable') {
          await wait(700 + Math.random() * 800);
          snap = await ref.get();
        } else throw e;
      }
      if (snap && snap.exists) mergeLoaded(snap.data());
      S.store.ref = ref;
      setStatus('db');
      if (S.session.n > 0 || S.touched) scheduleSave();
    } catch (e) {
      setStatus('none');
    }
  }
  function scheduleSave() {
    if (!S.store.ref) return;
    clearTimeout(S.store.timer);
    S.store.timer = setTimeout(flush, 1500);
  }
  async function flush() {
    const st = S.store;
    clearTimeout(st.timer);
    if (!st.ref) return;
    if (st.saving) {
      st.dirty = true;
      return;
    }
    st.saving = true;
    let retry = false;
    try {
      await st.ref.set(JSON.parse(JSON.stringify({ v: 1, keys: S.stats.keys, drills: S.stats.drills, settings: S.settings })));
    } catch (e) {
      const code = e && e.code;
      if (code === 'unavailable' || code === 'resource_exhausted') retry = true;
      else {
        st.ref = null;
        setStatus('none');
      }
    } finally {
      st.saving = false;
      if ((st.dirty || retry) && st.ref) {
        st.dirty = false;
        st.timer = setTimeout(flush, 1200 + Math.random() * 1200);
      }
    }
  }

  /* ---------- Wiring ---------- */
  function init() {
    buildAllBags();
    buildSettings();
    ['quiz', 'explore', 'progress', 'settings'].forEach(v => $('#tab-' + v).addEventListener('click', () => showView(v)));
    $('#pad').addEventListener('click', onPad);
    $('#qNotes').addEventListener('input', growNotes);
    // Hold to answer: pointer events cover mouse, touch and pen alike.
    const hold = $('#holdBtn');
    hold.addEventListener('pointerdown', e => { try { hold.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } holdStart(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => hold.addEventListener(ev, holdEnd));
    hold.addEventListener('contextmenu', e => e.preventDefault());
    hold.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) holdStart(e); });
    hold.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') holdEnd(e); });
    $('#qSay').addEventListener('click', () => { unlockAudio(); sayQuestion(); });
    if (Voice.canSpeak) {
      try { speechSynthesis.addEventListener('voiceschanged', fillVoicePick); } catch (e) { /* ignore */ }
      setTimeout(fillVoicePick, 300);
    }
    Checker.onChange(() => { refreshCheckerNote(); });
    Checker.init();
    document.addEventListener('keydown', e => {
      if (S.view !== 'quiz' || S.atStart || e.metaKey || e.ctrlKey || e.altKey) return;
      // Typing in the answer box or the working box is typing, not shortcuts.
      const tg = e.target;
      if (tg && (tg.tagName === 'TEXTAREA' || tg.tagName === 'INPUT' || tg.isContentEditable)) return;
      if (e.key === 'Enter') {
        const c = $('#checkBtn');
        if (S.answered) {
          e.preventDefault();
          nextQuestion();
        } else if (c && !c.disabled) {
          e.preventDefault();
          submit(S.entry.tokens.slice());
        }
      } else if (e.key === 'Backspace' && !S.answered) {
        e.preventDefault();
        undo();
      } else if (!S.answered && S.q.input === 'degree' && /^[1-7]$/.test(e.key)) {
        submit([T.MODES[S.q.degreeMode].labels[+e.key - 1]]);
      } else if (!S.answered && S.q.input === 'choice' && S.settings.answerStyle !== 'typing' && /^[0-9]$/.test(e.key)) {
        /* On a pad whose options ARE numbers — the fret pads run 0 to 11 —
           the digit has to mean the option it reads, not the option in that
           position. Counting positions made pressing 5 answer fret 4, which
           is wrong in the most quietly infuriating way: it looks like you
           misread the neck. */
        const numeric = S.q.choices.every(c => /^\d+$/.test(c));
        const byLabel = numeric ? S.q.choices.find(c => c === e.key) : null;
        const pick = byLabel !== null && byLabel !== undefined
          ? byLabel
          : (e.key !== '0' ? S.q.choices[+e.key - 1] : null);
        if (pick) { e.preventDefault(); submit([pick]); }
      } else if (!S.answered && S.q.input === 'choice' && e.key.length === 1 && /\S/.test(e.key)) {
        // Typing: the first key pressed anywhere starts the answer.
        const inp = $('#ansText');
        if (inp) inp.focus();
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && S.store.ref && S.store.timer) flush();
    });
    window.addEventListener('pagehide', () => {
      if (S.store.ref && S.store.timer) flush();
    });
    nextQuestion();
    // Every visit opens on the difficulty picker, with the last one chosen
    // highlighted. A question is drawn behind it so the app is never empty.
    $('#levelChip').addEventListener('click', showStart);
    showStart();
    initStore();

    /* A deliberate, read-only surface for automated checking. It can answer
       correctly as well as wrongly, which matters: without it a test can only
       ever drive the miss path, and the half of the app that runs when you are
       RIGHT — the verdict, the strip, the stat, the advance — would go
       unexercised. Everything here reads or submits; nothing reaches in and
       sets state the UI would not. */
    window.KFTest = {
      q: () => (S.q ? {
        drill: S.q.drill, input: S.q.input, slots: S.q.slots,
        answer: S.q.answer.slice(), key: S.q.key ? T.keyName(S.q.key) : null,
        type: S.q.type || null, sub: S.q.sub, anyOf: S.q.anyOf ? S.q.anyOf.slice() : null,
      } : null),
      answerRight: () => { if (S.answered || !S.q) return false; submit(S.q.answer.slice()); return true; },
      answerWrong: tokens => { if (S.answered || !S.q) return false; submit(tokens); return true; },
      reveal: () => { if (S.answered || !S.q) return false; submit(null, true); return true; },
      answered: () => S.answered,
      drills: () => Q.DRILLS.map(d => d.id),
      // Drive the Explore view's key picker, so the neck map can be checked
      // in all 24 keys rather than whichever one it opened on.
      explore: (mode, slot) => { S.explore.mode = mode; S.explore.slot = slot;
        S.explore.sp = 0; renderExplore();
        const k = exploreKey();
        return { name: T.keyName(k), tonicPc: T.pc(k.tonic) }; },
      session: () => Object.assign({}, S.session),
      stats: () => JSON.parse(JSON.stringify(S.stats)),
      settings: () => JSON.parse(JSON.stringify(S.settings)),
      setDrills: ids => {
        DRILL_IDS.forEach(id => { S.settings.drills[id] = ids.includes(id); });
        buildDrillBag();
        if (S.atStart) hideStart();
        nextQuestion();
      },
      next: () => { if (S.atStart) hideStart(); nextQuestion(); },
      start: id => startAt(id),
      level: () => S.settings.level,
      atStart: () => !!S.atStart,
      clockMs: () => clockFor(S.q),
      choices: () => (S.q && S.q.choices ? S.q.choices.slice() : null),
      answerStyle: v => { if (v) { S.settings.answerStyle = v; if (S.q && !S.answered) renderPad(); } return S.settings.answerStyle; },
      type: text => {
        if (S.answered || !S.q || S.q.input !== 'choice') return false;
        $('#ansText').value = text; submitTyped(); return true;
      },
      notes: text => { $('#qNotes').value = text; growNotes(); },
      heard: text => useHeard(text),
      matches: (text) => (S.q ? typedMatch(S.q, text) : null),
      entry: () => ({ tokens: S.entry.tokens.slice(), pending: S.entry.pending, slots: S.q && S.q.slots }),
      review: () => (S.ck.review ? { text: S.ck.review.text, q: S.ck.review.q.drill } : null),
      reviewPrompt: () => (S.ck.review ? reviewPrompt(S.ck.review.q, S.ck.review.r) : null),
      checker: () => ({ route: Checker.route, status: Checker.status }),
      recent: () => S.recent.slice(),
      speakText: () => (S.q ? questionLine(S.q) : null),
      // Asking ahead: the words of the question made for next, and how often
      // a made-ahead question was actually used.
      upcoming: () => (S.upcoming ? questionLine(S.upcoming.q) : null),
      answerText: () => (S.q ? Voice.speakable(answerLine(S.q)) : null),
      ahead: () => Object.assign({}, S.ahead),
      /* Pure, and touches nothing: runs a stored payload through the same
         cleaning the app applies on load. Saved progress from before the
         overhaul still names drills that no longer exist, and the only other
         way to test that path is to corrupt someone's real data. */
      roundTrip: d => sanitizeSettings(d),
      load: d => { mergeLoaded(d); return { settings: JSON.parse(JSON.stringify(S.settings)),
        stats: JSON.parse(JSON.stringify(S.stats)) }; },
    };
  }
  init();
})();
</script>
